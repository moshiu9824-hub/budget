<!DOCTYPE html>
<html lang="zh-TW" style="color-scheme:light;">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>錢去哪了</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── 飛天小女警正式色碼版 ── */
:root {
  /* 背景 */
  --bg:#FCFCF3;
  --surface:#ffffff;
  --surface2:#F7F7EC;
  --border:#EDE8D8;
  --text:#2D2D2D;
  --muted:#A89880;

  /* 花花：橘紅系 */
  --blossom:#EF6F5D;
  --blossom-soft:#F9B384;
  --blossom-light:#FEF3EE;
  --blossom-skin:#FEEFE0;

  /* 泡泡：藍黃系 */
  --bubbles:#93D6ED;
  --bubbles-yellow:#FFE681;
  --bubbles-light:#EEF9FD;

  /* 毛毛：綠系 */
  --buttercup:#A6D785;
  --buttercup-light:#F0F9E8;

  /* 裝飾色 */
  --deco-pink:#F7A8CA;
  --deco-pink-light:#FEF0F7;
  --deco-yellow:#FFF263;
  --deco-yellow-light:#FFFDE8;

  /* 語意 */
  --danger:#EF6F5D;
  --danger-light:#FEF3EE;
  --warning:#F9B384;
  --warning-light:#FEF6EE;
  --success:#A6D785;
  --success-light:#F0F9E8;
  --info:#93D6ED;
  --info-light:#EEF9FD;

  --radius:12px;
  --radius-lg:18px;
  --shadow:0 2px 8px rgba(45,45,45,.07);
  --shadow-md:0 4px 16px rgba(45,45,45,.1);
}

*{box-sizing:border-box;margin:0;padding:0;}
html{color-scheme:light;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Noto Sans TC',sans-serif;
  font-size:14px;
  min-height:100vh;
  background-image:
    radial-gradient(circle at 5% 8%,  rgba(147,214,237,.18) 0%, transparent 28%),
    radial-gradient(circle at 95% 6%,  rgba(239,111,93,.12) 0%, transparent 25%),
    radial-gradient(circle at 50% 96%, rgba(166,215,133,.14) 0%, transparent 30%),
    radial-gradient(circle at 82% 55%, rgba(255,230,129,.12) 0%, transparent 22%),
    radial-gradient(circle at 18% 70%, rgba(247,168,202,.12) 0%, transparent 22%);
}
.app{display:flex;flex-direction:column;min-height:100vh;max-width:900px;margin:0 auto;}

/* Header */
header{padding:16px 16px 0;display:flex;align-items:center;justify-content:space-between;}
.logo{font-family:'DM Mono',monospace;font-size:17px;color:var(--blossom);font-weight:700;letter-spacing:-0.5px;}
.month-nav{display:flex;align-items:center;gap:8px;}
.month-nav button{background:var(--surface);border:2px solid var(--border);color:var(--muted);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;transition:all .2s;box-shadow:var(--shadow);}
.month-nav button:hover{background:var(--blossom);color:#fff;border-color:var(--blossom);}
.month-label{font-family:'DM Mono',monospace;font-size:13px;color:var(--muted);min-width:72px;text-align:center;font-weight:600;}

/* Summary */
.summary-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:12px 16px;}
.stat-card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);padding:11px 13px;box-shadow:var(--shadow);}
.stat-card:nth-child(1){border-top:3px solid var(--bubbles);}
.stat-card:nth-child(2){border-top:3px solid var(--blossom);}
.stat-card:nth-child(3){border-top:3px solid var(--warning);}
.stat-card:nth-child(4){border-top:3px solid var(--buttercup);}
.stat-label{font-size:10px;color:var(--muted);margin-bottom:4px;font-weight:700;letter-spacing:.3px;}
.stat-val{font-family:'DM Mono',monospace;font-size:17px;font-weight:700;word-break:break-all;}
.stat-val.green{color:var(--buttercup);}
.stat-val.red{color:var(--blossom);}
.stat-val.orange{color:var(--blossom-soft);}
.stat-val.blue{color:var(--bubbles);}
.stat-sub{font-size:10px;color:var(--muted);margin-top:2px;}

/* Desktop tabs */
.tabs{display:flex;gap:5px;padding:0 16px 12px;flex-wrap:wrap;}
.tab{padding:7px 15px;border-radius:20px;font-size:13px;cursor:pointer;border:1.5px solid var(--border);background:var(--surface);color:var(--muted);transition:all .2s;font-weight:600;box-shadow:var(--shadow);}
.tab:hover:not(.active){border-color:var(--bubbles);color:var(--bubbles);}
.tab.active{color:#2D2D2D;border-color:transparent;box-shadow:var(--shadow-md);}
.tab:nth-child(1).active{background:var(--blossom-skin);color:var(--blossom);}
.tab:nth-child(2).active{background:var(--bubbles-light);color:#4aafc8;}
.tab:nth-child(3).active{background:var(--buttercup-light);color:#6aaa44;}
.tab:nth-child(4).active{background:var(--warning-light);color:#d4884a;}
.tab:nth-child(5).active{background:var(--deco-pink-light);color:#c0609a;}
.tab:nth-child(6).active{background:var(--deco-yellow-light);color:#b8a010;}

/* Bottom nav */
.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:rgba(252,252,243,.97);backdrop-filter:blur(12px);border-top:1.5px solid var(--border);z-index:50;padding:6px 0 calc(env(safe-area-inset-bottom,0px) + 8px);box-shadow:0 -3px 14px rgba(45,45,45,.07);}
.bottom-nav-inner{display:grid;grid-template-columns:repeat(6,1fr);max-width:900px;margin:0 auto;}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;cursor:pointer;color:var(--muted);transition:all .2s;border:none;background:transparent;font-family:'Noto Sans TC',sans-serif;}
.nav-item.active .nav-icon{transform:scale(1.2);}
.nav-item:nth-child(1).active{color:var(--blossom);}
.nav-item:nth-child(2).active{color:#4aafc8;}
.nav-item:nth-child(3).active{color:#6aaa44;}
.nav-item:nth-child(4).active{color:#d4884a;}
.nav-item:nth-child(5).active{color:#c0609a;}
.nav-item:nth-child(6).active{color:#b8a010;}
.nav-icon{font-size:20px;line-height:1;transition:transform .2s;}
.nav-label{font-size:9px;font-weight:700;}

.main{padding:0 16px 80px;flex:1;}

/* Form */
.add-form{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-lg);padding:15px;margin-bottom:14px;box-shadow:var(--shadow);}
.add-form-title{font-size:12px;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;font-weight:700;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;}
.g3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-bottom:8px;}
label{font-size:11px;color:var(--muted);display:block;margin-bottom:3px;font-weight:700;}

/* 修正日期選擇器黑底問題 */
input,select{
  width:100%;
  background:var(--surface2);
  border:1.5px solid var(--border);
  color:var(--text);
  border-radius:10px;
  padding:9px 11px;
  font-size:14px;
  font-family:'Noto Sans TC',sans-serif;
  outline:none;
  transition:all .2s;
  -webkit-appearance:none;
  appearance:none;
  color-scheme:light;
}
input[type="date"],
input[type="month"]{
  background:#ffffff !important;
  color:var(--text) !important;
  color-scheme:light !important;
}
input[type="date"]::-webkit-calendar-picker-indicator,
input[type="month"]::-webkit-calendar-picker-indicator{
  cursor:pointer;
  opacity:.6;
  background:transparent;
}
input[type="date"]::-webkit-datetime-edit,
input[type="month"]::-webkit-datetime-edit{
  color:var(--text);
}
input[type="date"]::-webkit-datetime-edit-fields-wrapper,
input[type="month"]::-webkit-datetime-edit-fields-wrapper{
  background:transparent;
}
input:focus,select:focus{border-color:var(--bubbles);background:#fff;box-shadow:0 0 0 3px var(--bubbles-light);}
select option{background:#fff;color:var(--text);}

.btn{border:none;border-radius:10px;padding:10px 18px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Noto Sans TC',sans-serif;white-space:nowrap;transition:all .2s;}
.btn-primary{background:var(--blossom);color:#fff;box-shadow:0 3px 10px rgba(239,111,93,.25);}
.btn-primary:hover{background:#d85a48;transform:translateY(-1px);}
.btn-secondary{background:var(--surface2);border:1.5px solid var(--border);color:var(--muted);}
.btn-secondary:hover{border-color:var(--bubbles);color:#4aafc8;}
.btn-danger-soft{background:var(--danger-light);border:1.5px solid #f5c0b0;color:var(--danger);}

.checkbox-label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap;font-weight:600;}
.checkbox-label input[type=checkbox]{width:15px;height:15px;accent-color:var(--blossom);-webkit-appearance:auto;appearance:auto;}

/* Pills — 正式色碼輪替 */
.pill{display:inline-block;font-size:11px;padding:2px 9px;border-radius:20px;font-weight:700;white-space:nowrap;}
.card-pill{display:inline-block;font-size:11px;padding:2px 9px;border-radius:7px;font-weight:700;white-space:nowrap;}

/* 10色輪替 */
[data-pi="0"]{background:var(--blossom-light);color:#c84a38;border:1.5px solid #F9B384;}
[data-pi="1"]{background:var(--bubbles-light);color:#3a9ec0;border:1.5px solid #93D6ED;}
[data-pi="2"]{background:var(--buttercup-light);color:#5a9a30;border:1.5px solid #A6D785;}
[data-pi="3"]{background:var(--deco-yellow-light);color:#a08010;border:1.5px solid #FFE681;}
[data-pi="4"]{background:var(--deco-pink-light);color:#c0509a;border:1.5px solid #F7A8CA;}
[data-pi="5"]{background:var(--warning-light);color:#c87030;border:1.5px solid #F9B384;}
[data-pi="6"]{background:#F0EEF8;color:#7060b0;border:1.5px solid #C8C0E0;}
[data-pi="7"]{background:#EEF8F4;color:#308870;border:1.5px solid #88D0B8;}
[data-pi="8"]{background:#EEF4F8;color:#3060a0;border:1.5px solid #88B0D8;}
[data-pi="9"]{background:#F8EEF0;color:#b04060;border:1.5px solid #E0A8B0;}

.fixed-badge{font-size:10px;background:var(--buttercup-light);color:#5a9a30;border-radius:5px;padding:1px 6px;margin-left:3px;font-weight:700;border:1px solid #A6D785;}
.billing-badge{font-size:10px;color:#3a72b0;background:#e8f0fb;border-radius:5px;padding:1px 6px;margin-left:3px;font-weight:700;border:1px solid #a8c4ec;}
.inst-badge{font-size:10px;color:#7060b0;background:#F0EEF8;border-radius:5px;padding:1px 5px;margin-left:3px;font-weight:700;border:1px solid #C8C0E0;}
.paid-badge{font-size:10px;color:#5a9a30;background:var(--buttercup-light);border-radius:5px;padding:1px 5px;font-weight:700;border:1px solid #A6D785;}
.unpaid-badge{font-size:10px;color:#c87030;background:var(--warning-light);border-radius:5px;padding:1px 5px;font-weight:700;border:1px solid #F9B384;}

/* Table */
.table-wrap{overflow-x:auto;border-radius:var(--radius-lg);border:1.5px solid var(--border);background:var(--surface);box-shadow:var(--shadow);}
table{width:100%;border-collapse:collapse;}
th{font-size:11px;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1.5px solid var(--border);white-space:nowrap;background:var(--surface2);font-weight:700;letter-spacing:.3px;}
td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--surface2);}
.td-name{font-size:13px;max-width:150px;font-weight:600;}
.td-amt{font-family:'DM Mono',monospace;font-size:13px;text-align:right;white-space:nowrap;font-weight:700;color:var(--blossom);}
.td-date{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);white-space:nowrap;}
.btn-icon{background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:15px;padding:3px 6px;border-radius:8px;transition:all .2s;}
.btn-icon.edit:hover{background:var(--bubbles-light);color:#3a9ec0;}
.btn-icon.del:hover{background:var(--danger-light);color:var(--danger);}
.btn-sm{background:var(--surface2);border:1.5px solid var(--border);color:var(--muted);cursor:pointer;font-size:11px;padding:3px 9px;border-radius:8px;transition:all .2s;white-space:nowrap;font-family:'Noto Sans TC',sans-serif;font-weight:600;}
.btn-sm.done{border-color:#A6D785;color:#5a9a30;background:var(--buttercup-light);}
.btn-sm:hover:not(.done){border-color:#F9B384;color:#c87030;background:var(--warning-light);}

/* Filter */
.filter-bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center;}
.filter-select{background:var(--surface);border:1.5px solid var(--border);color:var(--text);border-radius:10px;padding:7px 11px;font-size:12px;font-family:'Noto Sans TC',sans-serif;outline:none;cursor:pointer;font-weight:600;box-shadow:var(--shadow);color-scheme:light;}

/* Board */
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;}
.board-col{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-lg);padding:13px;box-shadow:var(--shadow);overflow:hidden;}
.board-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.board-sum{font-family:'DM Mono',monospace;font-size:13px;color:var(--muted);font-weight:700;}
.board-item{background:var(--surface2);border-radius:10px;padding:8px 10px;margin-bottom:6px;border:1px solid var(--border);overflow:hidden;}
.board-item-name{font-size:12px;margin-bottom:3px;font-weight:600;}
.board-item-meta{font-size:11px;display:flex;gap:4px;flex-wrap:wrap;margin-top:3px;}
.board-item-amt{font-family:'DM Mono',monospace;font-size:13px;color:var(--blossom);margin-top:3px;font-weight:700;}

/* Owed */
.section-header{font-size:10px;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:6px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;}
.section-header::after{content:'';flex:1;height:1.5px;background:var(--border);}
.owed-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-bottom:16px;}
.owed-card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);padding:12px;box-shadow:var(--shadow);}
.owed-name{font-size:11px;color:var(--muted);margin-bottom:4px;font-weight:600;}
.owed-amt{font-family:'DM Mono',monospace;font-size:18px;color:#c87030;font-weight:700;}
.owed-count{font-size:11px;color:var(--muted);margin-top:2px;}

/* Billing */
.billing-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;}
.billing-card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-lg);padding:16px;box-shadow:var(--shadow);}
.billing-card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
.billing-card-info{font-size:11px;color:var(--muted);margin-top:4px;font-weight:600;}
.billing-total{font-family:'DM Mono',monospace;font-size:22px;font-weight:700;color:var(--blossom);text-align:right;}
.billing-total.warn{color:#c87030;}.billing-total.danger{color:var(--blossom);}
.billing-remaining{font-size:11px;color:var(--muted);text-align:right;margin-top:2px;font-weight:600;}
.limit-bar-bg{background:var(--surface2);border-radius:6px;height:8px;overflow:hidden;margin:8px 0 4px;border:1px solid var(--border);}
.limit-bar-fill{height:8px;border-radius:6px;}
.limit-bar-fill.safe{background:linear-gradient(90deg,var(--buttercup),#C8E8A0);}
.limit-bar-fill.warn{background:linear-gradient(90deg,#F9B384,#FFE681);}
.limit-bar-fill.danger{background:linear-gradient(90deg,var(--blossom),#F9B384);}
.limit-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:10px;font-weight:600;}
.date-range-row{display:flex;align-items:center;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
.date-range-row label{margin-bottom:0;white-space:nowrap;}
.date-range-row input{flex:1;min-width:110px;width:auto;padding:6px 9px;font-size:12px;}
.btn-apply{background:var(--surface2);border:1.5px solid var(--border);color:var(--muted);border-radius:8px;padding:6px 11px;font-size:12px;cursor:pointer;white-space:nowrap;font-family:'Noto Sans TC',sans-serif;font-weight:600;}
.btn-apply:hover{border-color:var(--bubbles);color:#3a9ec0;}
.billing-items{border-top:1.5px solid var(--border);padding-top:8px;max-height:200px;overflow-y:auto;}
.billing-item{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);font-size:12px;gap:6px;}
.billing-item:last-child{border-bottom:none;}
.billing-item-left{flex:1;min-width:0;}
.billing-item-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;}
.billing-item-date{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);}
.billing-item-amt{font-family:'DM Mono',monospace;color:var(--blossom);flex-shrink:0;font-weight:700;}
.billing-no-items{font-size:12px;color:var(--muted);text-align:center;padding:14px 0;}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(45,45,45,.3);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;z-index:100;padding:0;}
.modal{background:var(--surface);border:1.5px solid var(--border);border-radius:22px 22px 0 0;padding:20px 16px 36px;width:100%;max-width:600px;max-height:92vh;overflow-y:auto;box-shadow:0 -8px 32px rgba(45,45,45,.1);}
.modal-handle{width:40px;height:5px;background:var(--border);border-radius:3px;margin:0 auto 16px;}
.modal-title{font-size:16px;font-weight:700;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;}
.modal-actions{display:flex;gap:8px;margin-top:16px;}
.modal-actions .btn{flex:1;padding:12px;}

/* Settings */
.settings-section{margin-bottom:24px;}
.settings-title{font-size:10px;color:var(--muted);margin-bottom:10px;padding-bottom:6px;border-bottom:1.5px solid var(--border);font-weight:700;letter-spacing:.8px;text-transform:uppercase;}
.tag-list{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
.tag-item{display:flex;align-items:center;gap:4px;background:var(--surface2);border:1.5px solid var(--border);border-radius:20px;padding:4px 10px;font-size:12px;font-weight:600;}
.tag-item button{background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:14px;padding:0 2px;line-height:1;}
.tag-item button:hover{color:var(--blossom);}
.tag-add-row{display:flex;gap:8px;}
.tag-add-row input{flex:1;}

/* Salary */
.salary-detail{background:var(--surface2);border-radius:var(--radius);padding:14px;margin-top:8px;font-size:13px;border:1.5px solid var(--border);}
.salary-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;}
.salary-row.total{border-top:1.5px solid var(--border);margin-top:6px;padding-top:10px;font-weight:700;font-size:15px;}
.salary-val{font-family:'DM Mono',monospace;font-weight:700;}
.salary-val.red{color:var(--blossom);}
.salary-val.green{color:#5a9a30;}
.salary-val.muted{color:var(--muted);}

/* Group sections */
.group-section{margin-bottom:20px;}
.group-header{
  display:flex;
  align-items:center;
  gap:8px;
  padding:10px 2px;
  margin-bottom:8px;
  border-bottom:1.5px solid var(--border);
  flex-wrap:wrap;
}
.group-total{
  font-family:'DM Mono',monospace;
  font-size:14px;
  font-weight:700;
  color:var(--blossom);
  margin-left:auto;
}
.group-owed{
  font-size:11px;
  color:#c87030;
  background:var(--warning-light);
  border:1px solid #F9B384;
  border-radius:6px;
  padding:2px 7px;
  font-weight:700;
}

/* Unified pill sizing */
.pill, .card-pill{
  font-size:12px !important;
  padding:3px 10px !important;
  line-height:1.4;
  vertical-align:middle;
}
.fixed-badge, .inst-badge, .paid-badge, .unpaid-badge{
  font-size:11px !important;
  padding:2px 7px !important;
  line-height:1.4;
  vertical-align:middle;
}
.btn-sm{
  font-size:11px !important;
  padding:3px 9px !important;
  line-height:1.4;
  vertical-align:middle;
}

/* Empty */
.empty{text-align:center;padding:48px 24px;color:var(--muted);font-size:13px;}

/* Expense card list */
.expense-list{display:flex;flex-direction:column;gap:8px;}
.expense-card{
  background:var(--surface);
  border:1.5px solid var(--border);
  border-radius:var(--radius);
  padding:12px 14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  box-shadow:var(--shadow);
  transition:background .15s;
}

<script>
// ── Storage helpers ────────────────────────────────────────────
// Storage: localStorage as cache + Firebase as sync backend
const S = {
  get(k, def) {
    try {
      const v = localStorage.getItem(k);
      return v !== null ? JSON.parse(v) : def;
    } catch { return def; }
  },
  set(k, v) {
    localStorage.setItem(k, JSON.stringify(v));
    // Async sync to Firebase
    if (window.FB) window.FB.set(k, JSON.stringify(v));
  },
  del(k) {
    localStorage.removeItem(k);
    if (window.FB) window.FB.del(k);
  }
};

// Pull all data from Firebase into localStorage on startup
function reorderCards(){
  const preferred=['台新','現金','玉山','國泰','富邦','聯邦','華南','中信'];
  const current=S.get('cards', null);
  if(!current) return;
  const reordered=[
    ...preferred.filter(c=>current.includes(c)),
    ...current.filter(c=>!preferred.includes(c))
  ];
  // 直接寫 localStorage，不 trigger Firebase 避免迴圈
  localStorage.setItem('cards', JSON.stringify(reordered));
  if(window.FB) window.FB.set('cards', JSON.stringify(reordered));
}

async function syncFromFirebase() {
  if (!window.FB) return;
  showSyncStatus('同步中…');
  try {
    const keys = [
      'people','cards','card_settings','salary','card_payments',
      // expense keys for past 12 months
      ...Array.from({length:13}, (_,i) => {
        const d = new Date(); d.setMonth(d.getMonth() - i);
        return `expenses_${d.getFullYear()}_${d.getMonth()+1}`;
      })
    ];
    let synced = 0;
    await Promise.all(keys.map(async k => {
      const val = await window.FB.get(k);
      if (val !== null) { localStorage.setItem(k, val); synced++; }
    }));
    // 強制卡片順序
    reorderCards();
    showSyncStatus('已同步 ✓', true);
    autoCarryInstallments();
    render();
    updateSummary();
  } catch(e) {
    showSyncStatus('離線模式', false, true);
    console.warn('Firebase sync failed:', e);
  }
}

function showSyncStatus(msg, ok=false, warn=false) {
  let el = document.getElementById('syncStatus');
  if (!el) return;
  el.textContent = msg;
  el.style.color = warn ? 'var(--warning)' : ok ? 'var(--buttercup)' : 'var(--muted)';
  if (ok) setTimeout(() => { if(el) el.textContent = ''; }, 3000);
}

// ── State ──────────────────────────────────────────────────────
let currentTab='list';
let currentMonth=new Date(); currentMonth.setDate(1);
let billingRanges={};
let editingId=null;

// ── People & Cards (dynamic) ───────────────────────────────────
const DEFAULT_PEOPLE=['我自己','懶人爸','阿肥媽','豬頭弟','小八貓'];
const DEFAULT_CARDS=['台新','現金','玉山','國泰','富邦','聯邦','華南','中信'];
const CARD_DEFAULTS={
  '玉山':{limit:70000,billingDay:27},'台新':{limit:30000,billingDay:2},
  '國泰':{limit:60000,billingDay:10},'中信':{limit:60000,billingDay:5},
  '聯邦':{limit:60000,billingDay:12},'富邦':{limit:100000,billingDay:8},
  '華南':{limit:60000,billingDay:23},'現金':{limit:0,billingDay:0}
};
// Pill colors pool for dynamic entries
const PILL_COLORS=[
  {bg:'#1e2e00',fg:'#c8f04a'},{bg:'#0a2030',fg:'#7ec8e3'},{bg:'#2e1e00',fg:'#ffb347'},
  {bg:'#2e0a18',fg:'#f4a0c0'},{bg:'#1a1030',fg:'#b39ddb'},{bg:'#1a2020',fg:'#80cbc4'},
  {bg:'#2e1a00',fg:'#ff8a65'},{bg:'#1e001e',fg:'#ce93d8'},{bg:'#002020',fg:'#a5d6a7'},
  {bg:'#200010',fg:'#f48fb1'}
];
const CARD_COLORS=[
  {bg:'#0a2030',fg:'#4fc3f7'},{bg:'#2e1000',fg:'#ff8a65'},{bg:'#0a200a',fg:'#a5d6a7'},
  {bg:'#2e0a18',fg:'#f48fb1'},{bg:'#2e2000',fg:'#ffe082'},{bg:'#0a1e1c',fg:'#80cbc4'},
  {bg:'#1e0a2e',fg:'#ce93d8'},{bg:'#201a16',fg:'#bcaaa4'},{bg:'#1a1a00',fg:'#f0e68c'},
  {bg:'#002a1a',fg:'#69f0ae'}
];

function getPeople(){return S.get('people',DEFAULT_PEOPLE);}
function getCards(){return S.get('cards',DEFAULT_CARDS);}
function savePeople(p){S.set('people',p);}
function saveCards(c){S.set('cards',c);}

function personColor(name){
  const people=getPeople();
  const i=people.indexOf(name)%PILL_COLORS.length;
  return PILL_COLORS[Math.max(0,i)];
}
function cardColor(name){
  const cards=getCards();
  const i=cards.indexOf(name)%CARD_COLORS.length;
  return CARD_COLORS[Math.max(0,i)];
}

function personPill(p){
  const people=getPeople();
  const i=Math.abs(people.indexOf(p))%10;
  return `<span class="pill" data-pi="${i}">${p}</span>`;
}
function cardPill(c){
  const cards=getCards();
  const i=(Math.abs(cards.indexOf(c))+3)%10;
  return `<span class="card-pill" data-pi="${i}">${c}</span>`;
}

// ── Expense data ───────────────────────────────────────────────
function monthKey(d){return `expenses_${d.getFullYear()}_${d.getMonth()+1}`;}
function getExpenses(d){return S.get(monthKey(d||currentMonth),[]);}
function saveExpenses(data,d){S.set(monthKey(d||currentMonth),data);}

function getSalary(){return S.get('salary',36884);}
function saveSalary(v){S.set('salary',v);}
function getCardSettings(){
  const saved=S.get('card_settings',{});
  const m={};
  getCards().forEach(c=>{m[c]=Object.assign({},CARD_DEFAULTS[c]||{limit:0,billingDay:0},saved[c]||{});});
  return m;
}
function saveCardSettings(d){S.set('card_settings',d);}

// ── Date helpers ───────────────────────────────────────────────
function toSlash(s){return s?s.replace(/-/g,'/'):'';} 
function toInput(s){return s?s.replace(/\//g,'-'):'';} 
function fmtSlash(d){return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;}
function todayInput(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function fmt(n){return 'NT$'+Math.round(n).toLocaleString();}

// ── Billing range ──────────────────────────────────────────────
function getBillingRange(card,refMonth){
  const s=getCardSettings()[card];
  if(!s||!s.billingDay)return null;
  const day=s.billingDay,y=refMonth.getFullYear(),m=refMonth.getMonth();
  return{from:fmtSlash(new Date(y,m-1,day+1)),to:fmtSlash(new Date(y,m,day))};
}
function initBillingRanges(){
  getCards().filter(c=>c!=='現金').forEach(c=>{
    if(!billingRanges[c]){const r=getBillingRange(c,currentMonth);if(r)billingRanges[c]=r;}
  });
}

// ── Summary ────────────────────────────────────────────────────
function updateSummary(){
  const salary=getSalary();
  const lastMonth=new Date(currentMonth.getFullYear(),currentMonth.getMonth()-1,1);
  const lastEx=getExpenses(lastMonth);

  // 上月卡費：只算「我自己」的，代墊別人但已收回的不扣，未收回的也不扣（那是別人的錢）
  const lastCardTotal=lastEx
    .filter(e=>e.card!=='現金' && e.person==='我自己')
    .reduce((s,e)=>s+e.amount,0);

  const ex=getExpenses();

  // 本月現金：只算「我自己」的
  const cashTotal=ex
    .filter(e=>e.card==='現金' && e.person==='我自己')
    .reduce((s,e)=>s+e.amount,0);

  // 代墊未收：給別人看的，不影響薪資剩餘
  const owed=ex.filter(e=>e.person!=='我自己'&&!e.paid).reduce((s,e)=>s+e.amount,0);

  const left=salary-lastCardTotal-cashTotal;

  document.getElementById('sumSalary').textContent=fmt(salary);
  document.getElementById('sumLastCard').textContent=fmt(lastCardTotal+cashTotal);
  const lm=`${lastMonth.getFullYear()}/${String(lastMonth.getMonth()+1).padStart(2,'0')}`;
  document.getElementById('sumLastCardSub').textContent=`${lm}我的卡費＋本月現金`;
  document.getElementById('sumOwed').textContent=fmt(owed);
  document.getElementById('sumLeft').textContent=fmt(left);
  document.getElementById('sumLeft').className='stat-val '+(left<0?'red':'green');
}

// ── Navigation ─────────────────────────────────────────────────
function changeMonth(dir){
  currentMonth.setMonth(currentMonth.getMonth()+dir);
  billingRanges={};
  document.getElementById('monthLabel').textContent=
    `${currentMonth.getFullYear()}/${String(currentMonth.getMonth()+1).padStart(2,'0')}`;
  autoCarryInstallments();
  render();
}

// 自動把上個月未完成的分期帶到本月（靜默執行，不彈窗）
function autoCarryInstallments(){
  const ex=getExpenses(); // 本月
  const lastMonth=new Date(currentMonth.getFullYear(),currentMonth.getMonth()-1,1);
  const lastEx=getExpenses(lastMonth);

  // 找上個月有分期且還沒結束的
  const pendingInst=lastEx.filter(e=>
    e.installment && e.instCur && e.instTotal && e.instCur < e.instTotal
  );
  if(!pendingInst.length) return;

  // 已存在本月的 sourceId 集合（防重複）
  const existingSources=new Set(ex.filter(e=>e.sourceId).map(e=>e.sourceId));
  // 也把本月已有的 originId（最原始來源）納入
  const existingOrigins=new Set(ex.filter(e=>e.originId).map(e=>e.originId));

  let added=0;
  pendingInst.forEach(e=>{
    // 用 originId 追蹤最原始那筆，避免鏈式重複
    const origin=e.originId||e.id;
    if(existingSources.has(e.id)) return;
    if(existingOrigins.has(origin)) return;

    // 計算本月應該是第幾期
    const nextCur=e.instCur+1;
    // 日期用本月的同一天（或月底）
    const origDay=parseInt((e.date||'').split('/')[2]||'1');
    const y=currentMonth.getFullYear(), m=currentMonth.getMonth();
    const lastDay=new Date(y,m+1,0).getDate();
    const day=Math.min(origDay,lastDay);
    const date=`${y}/${String(m+1).padStart(2,'0')}/${String(day).padStart(2,'0')}`;

    ex.push({
      ...e,
      id:Date.now()+Math.random(),
      sourceId:e.id,
      originId:origin,
      date,
      paid:false,
      instCur:nextCur,
    });
    added++;
  });

  if(added>0) saveExpenses(ex);
}
function switchTab(tab){
  currentTab=tab;
  const tabs=['list','card','person','owed','billing','settings'];
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',tabs[i]===tab));
  // Update bottom nav
  tabs.forEach(t=>{
    const el=document.getElementById('nav-'+t);
    if(el)el.classList.toggle('active',t===tab);
  });
  if(tab==='billing')initBillingRanges();
  render();
}

// ── Add expense ────────────────────────────────────────────────
function addExpense(){
  const name=document.getElementById('f-name').value.trim();
  const amount=parseInt(document.getElementById('f-amount').value);
  const card=document.getElementById('f-card').value;
  const person=document.getElementById('f-person').value;
  const date=toSlash(document.getElementById('f-date').value);
  const fixed=document.getElementById('f-fixed').checked;
  const isInst=document.getElementById('f-inst').checked;
  const instCur=isInst?parseInt(document.getElementById('f-inst-cur').value||1):null;
  const instTotal=isInst?parseInt(document.getElementById('f-inst-total').value||1):null;
  if(!name||!amount||!card||!person||!date)return;
  // 帳單月份：預設同消費月份
  const dateObj=date.split('/');
  const billingMonth=`${dateObj[0]}/${dateObj[1]}`;
  const ex=getExpenses();
  ex.unshift({id:Date.now(),name,amount,card,person,date,billingMonth,fixed,installment:isInst,instCur,instTotal,paid:false});
  saveExpenses(ex);
  document.getElementById('f-name').value='';
  document.getElementById('f-amount').value='';
  document.getElementById('f-fixed').checked=false;
  document.getElementById('f-inst').checked=false;
  document.getElementById('f-inst-fields').style.display='none';
  render();
}
function toggleAddInst(){
  document.getElementById('f-inst-fields').style.display=
    document.getElementById('f-inst').checked?'grid':'none';
}

// ── Import fixed from last month ───────────────────────────────
function importFixed(){
  const lastMonth=new Date(currentMonth.getFullYear(),currentMonth.getMonth()-1,1);
  const lastEx=getExpenses(lastMonth);
  // 匯入：固定支出 + 還沒繳完的分期
  const toCarry=lastEx.filter(e=>{
    if(e.fixed) return true;
    // 分期且還有下一期
    if(e.installment && e.instCur && e.instTotal && e.instCur < e.instTotal) return true;
    return false;
  });
  if(!toCarry.length){alert('上個月沒有固定支出或未完成分期可以匯入');return;}
  const ex=getExpenses();
  const today=toSlash(todayInput());
  // 避免重複匯入：用來源 id 比對
  const existingSources=new Set(ex.filter(e=>e.sourceId).map(e=>e.sourceId));
  let imported=0;
  toCarry.forEach(e=>{
    // 防止重複
    if(existingSources.has(e.id)) return;
    const nextCur=e.installment&&e.instCur?e.instCur+1:e.instCur;
    ex.unshift({
      ...e,
      id:Date.now()+Math.random(),
      sourceId:e.id,  // 記錄來源，防止重複匯入
      date:today,
      paid:false,
      instCur:nextCur
    });
    imported++;
  });
  saveExpenses(ex);
  render();
  alert(imported>0?`已匯入 ${imported} 筆（固定支出 + 未完分期）`:'本月已匯入過，不重複新增');
}

// ── Delete ─────────────────────────────────────────────────────
let pendingDeleteId=null;
function deleteExpense(id){
  pendingDeleteId=id;
  const ex=getExpenses();
  const e=ex.find(x=>x.id===id);
  document.getElementById('confirmMsg').textContent=e?`刪除「${e.name}」？`:'確定刪除？';
  document.getElementById('confirmModal').style.display='flex';
}
function confirmDelete(){
  if(pendingDeleteId&&String(pendingDeleteId).startsWith('pay_')){
    const pid=parseInt(String(pendingDeleteId).replace('pay_',''));
    savePayments(getPayments().filter(p=>p.id!==pid));
  } else if(pendingDeleteId){
    saveExpenses(getExpenses().filter(e=>e.id!==pendingDeleteId));
  }
  pendingDeleteId=null;
  document.getElementById('confirmModal').style.display='none';
  render();
}
function cancelDelete(){
  pendingDeleteId=null;
  document.getElementById('confirmModal').style.display='none';
}
function togglePaid(id){
  const d=getExpenses();const e=d.find(x=>x.id===id);
  if(e)e.paid=!e.paid;saveExpenses(d);render();
}

// ── Edit modal ─────────────────────────────────────────────────
function openEdit(id){
  // 搜尋目前月份，找不到再往前後找
  let e=getExpenses().find(x=>x.id===id);
  if(!e){
    for(let i=-12;i<=12;i++){
      const d=new Date(currentMonth.getFullYear(),currentMonth.getMonth()+i,1);
      const found=getExpenses(d).find(x=>x.id===id);
      if(found){e=found;break;}
    }
  }
  if(!e)return;
  editingId=id;
  document.getElementById('e-name').value=e.name;
  document.getElementById('e-amount').value=e.amount;
  document.getElementById('e-date').value=toInput(e.date);
  document.getElementById('e-fixed').checked=!!e.fixed;
  const bm=e.billingMonth||e.date.substring(0,7).replace('/','-');
  document.getElementById('e-billing-month').value=bm.replace('/','-');
  document.getElementById('e-inst').checked=!!e.installment;
  document.getElementById('e-inst-cur').value=e.instCur||'';
  document.getElementById('e-inst-total').value=e.instTotal||'';
  document.getElementById('e-inst-fields').style.display=e.installment?'grid':'none';
  const people=getPeople(),cards=getCards();
  document.getElementById('e-card').innerHTML=cards.map(c=>`<option ${c===e.card?'selected':''}>${c}</option>`).join('');
  document.getElementById('e-person').innerHTML=people.map(p=>`<option ${p===e.person?'selected':''}>${p}</option>`).join('');
  document.getElementById('editModal').style.display='flex';
}
function closeModal(){document.getElementById('editModal').style.display='none';editingId=null;}
function closeModalOutside(ev){if(ev.target===document.getElementById('editModal'))closeModal();}
function toggleEditInst(){
  document.getElementById('e-inst-fields').style.display=
    document.getElementById('e-inst').checked?'grid':'none';
}
function saveEdit(){
  if(!editingId)return;
  const nameVal=document.getElementById('e-name').value.trim();
  const amtVal=parseInt(document.getElementById('e-amount').value);
  const cardVal=document.getElementById('e-card').value;
  const personVal=document.getElementById('e-person').value;
  const dateVal=toSlash(document.getElementById('e-date').value);
  const fixedVal=document.getElementById('e-fixed').checked;
  const isInst=document.getElementById('e-inst').checked;
  const instCurVal=isInst?parseInt(document.getElementById('e-inst-cur').value||1):null;
  const instTotalVal=isInst?parseInt(document.getElementById('e-inst-total').value||1):null;
  const billingMonthRaw=document.getElementById('e-billing-month').value;
  const billingMonth=billingMonthRaw?billingMonthRaw.replace('-','/'):null;
  if(!nameVal||!amtVal||!cardVal||!personVal||!dateVal){alert('請填寫所有必填欄位');return;}

  // 找原本這筆在哪個月
  let sourceMonth=currentMonth;
  let sourceEx=getExpenses(currentMonth);
  if(!sourceEx.find(x=>x.id===editingId)){
    for(let i=-12;i<=12;i++){
      const d=new Date(currentMonth.getFullYear(),currentMonth.getMonth()+i,1);
      if(getExpenses(d).find(x=>x.id===editingId)){sourceMonth=d;sourceEx=getExpenses(d);break;}
    }
  }
  const oldItem=sourceEx.find(x=>x.id===editingId)||{};

  const updatedExpense={
    ...oldItem,
    name:nameVal,amount:amtVal,card:cardVal,person:personVal,
    date:dateVal,fixed:fixedVal,installment:isInst,
    instCur:instCurVal,instTotal:instTotalVal,billingMonth,
    id:editingId,
  };

  const newMonthStr=billingMonth||dateVal.substring(0,7);
  const srcMonthStr=`${sourceMonth.getFullYear()}/${String(sourceMonth.getMonth()+1).padStart(2,'0')}`;

  if(newMonthStr!==srcMonthStr){
    // 從來源月份移除
    saveExpenses(sourceEx.filter(x=>x.id!==editingId),sourceMonth);
    // 加到目標月份
    const tParts=newMonthStr.split('/');
    const targetDate=new Date(parseInt(tParts[0]),parseInt(tParts[1])-1,1);
    const targetEx=getExpenses(targetDate);
    targetEx.unshift(updatedExpense);
    saveExpenses(targetEx,targetDate);
    alert(`已移到 ${newMonthStr}`);
  } else {
    const i=sourceEx.findIndex(x=>x.id===editingId);
    if(i>=0){sourceEx[i]=updatedExpense;saveExpenses(sourceEx,sourceMonth);}
  }
  closeModal();render();
}
