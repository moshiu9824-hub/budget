<!DOCTYPE html>
<html lang="zh-TW" style="color-scheme:light;">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<link rel="apple-touch-icon" href="icon.png"/>
<link rel="icon" href="icon.png"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="錢去哪了"/>
<title>錢去哪了</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F5EE;--surface:#ffffff;--surface2:#F0EDE4;--border:#E8E4D8;--text:#1A1A1A;--muted:#9A8870;
  --blossom:#EF6F5D;--blossom-light:#FEF3EE;--bubbles:#93D6ED;--bubbles-light:#EEF9FD;
  --buttercup:#A6D785;--buttercup-light:#F0F9E8;--warning:#F9B384;--warning-light:#FEF6EE;
  --deco-pink-light:#FEF0F7;--deco-yellow-light:#FFFDE8;
  --danger:#EF6F5D;--danger-light:#FEF3EE;
  --radius:16px;--radius-lg:24px;
  --shadow:0 2px 12px rgba(45,45,45,.08);--shadow-lg:0 4px 24px rgba(45,45,45,.10),0 1px 4px rgba(45,45,45,.06);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow-x:hidden;overflow-y:auto;color-scheme:light;}
body{background:var(--bg);color:var(--text);font-family:'Inter','Noto Sans TC',sans-serif;font-size:15px;}
.app{display:flex;flex-direction:column;max-width:520px;margin:0 auto;}

/* ── Header ── */
header{padding:28px 22px 16px;display:flex;align-items:center;justify-content:space-between;}
.logo{font-size:22px;font-weight:900;color:var(--text);letter-spacing:-0.5px;display:flex;align-items:center;gap:10px;}
.logo-dot{width:12px;height:12px;border-radius:50%;background:var(--blossom);}
#syncStatus{font-size:11px;color:var(--muted);font-weight:600;margin-left:8px;}
.month-nav{display:flex;align-items:center;gap:10px;}
.month-nav button{background:var(--surface);border:2px solid var(--border);color:var(--muted);width:38px;height:38px;border-radius:50%;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:inherit;transition:all .15s;}
.month-nav button:hover{background:var(--blossom);color:#fff;border-color:var(--blossom);}
.month-label{font-size:16px;color:var(--muted);font-weight:700;min-width:80px;text-align:center;letter-spacing:1px;}

/* ── 大摘要卡片 ── */
.main-card{margin:0 22px 8px;background:var(--surface);border-radius:20px;padding:13px 16px;box-shadow:var(--shadow-lg);position:relative;overflow:hidden;}
.main-card::before{content:"";position:absolute;width:100px;height:100px;border-radius:50%;top:-30px;right:-30px;background:var(--bubbles);opacity:0.08;}
.main-label{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.5px;margin-bottom:3px;}
.main-amount{font-size:18px;font-weight:900;color:var(--text);letter-spacing:1px;line-height:1;margin-bottom:11px;}
.main-row{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--border);padding-top:10px;}
.main-stat{display:flex;flex-direction:column;gap:2px;}
.main-stat:first-child{padding-right:12px;border-right:1px solid var(--border);}
.main-stat:last-child{padding-left:12px;}
.main-stat-val{font-size:14px;font-weight:900;letter-spacing:1px;line-height:1;}
.main-stat-val.green{color:#ced986;}
.main-stat-val.red{color:#e15d5e;}
.main-stat-label{font-size:11px;color:var(--muted);font-weight:700;}

/* ── 代墊未收條 ── */
.owed-bar{margin:0 22px;background:var(--surface);border-radius:14px;padding:10px 16px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-between;}
.owed-bar-label{font-size:12px;color:var(--muted);font-weight:700;}
.owed-bar-val{font-size:14px;font-weight:900;color:#c07020;letter-spacing:1px;}

/* ── 分頁標籤 ── */
.tabs-wrap{padding:8px 22px 0;}
.tabs{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;background:#EDE8D8;border-radius:50px;padding:10px 6px;border:1.5px solid #D8D0C0;}
.tab{font-size:13px;font-weight:700;cursor:pointer;border:none;background:transparent;color:#dbc8a1;white-space:nowrap;text-align:center;width:100%;font-family:inherit;padding:0;line-height:1;transition:color .15s;}
.tab.active{color:#9f754e;}

/* ── Main content ── */
.main{padding:10px 22px 100px;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}

/* ── 篩選列 ── */
.filter-bar{margin-bottom:12px;display:grid;grid-template-columns:1fr 1px 1fr;align-items:center;background:#EDE8D8;border-radius:50px;border:1.5px solid #D8D0C0;overflow:hidden;}
.filter-divider{width:1px;height:16px;background:#D8D0C0;}
.filter-select{background:transparent;border:none;color:#9f754e;padding:10px 0;font-size:13px;font-weight:700;font-family:inherit;outline:none;-webkit-appearance:none;appearance:none;cursor:pointer;width:100%;text-align:center;text-align-last:center;-webkit-text-align-last:center;color-scheme:light;line-height:1;display:block;}

/* ── 新增表單 ── */
.add-form{background:var(--surface);border-radius:var(--radius-lg);padding:22px 20px;margin-bottom:16px;box-shadow:var(--shadow);}
.add-form-title{font-size:15px;font-weight:700;color:var(--muted);margin-bottom:18px;display:flex;align-items:center;justify-content:space-between;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
.gfull{margin-bottom:14px;}
label{font-size:14px;color:var(--muted);display:block;margin-bottom:6px;font-weight:700;letter-spacing:.2px;}
input,select,textarea{width:100%;background:var(--surface2);border:1.5px solid var(--border);color:var(--text);border-radius:12px;padding:12px 14px;font-size:15px;font-family:inherit;outline:none;transition:border-color .15s;-webkit-appearance:none;appearance:none;color-scheme:light;}
input[type="date"],input[type="month"]{background:#fff!important;color-scheme:light!important;}
input:focus,select:focus,textarea:focus{border-color:var(--bubbles);}
textarea{resize:none;height:68px;line-height:1.5;}
.btn{border:none;border-radius:12px;padding:11px 18px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;transition:all .15s;}
.btn-primary{background:var(--text);color:#fff;}
.btn-primary:hover{background:#333;}
.btn-secondary{background:var(--surface2);border:1.5px solid var(--border);color:var(--muted);}
.btn-secondary:hover{border-color:var(--text);color:var(--text);}
.btn-danger-soft{background:var(--danger-light);border:1.5px solid #f5c0b0;color:var(--danger);}
.checkbox-label{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);cursor:pointer;white-space:nowrap;font-weight:700;}
.checkbox-label input[type=checkbox]{width:16px;height:16px;accent-color:var(--blossom);-webkit-appearance:auto;appearance:auto;}

/* ── 信用卡錢包卡片 ── */
.wallet-cards{display:flex;flex-direction:column;gap:14px;margin:0 22px;}
.wcard{border-radius:20px;padding:18px 22px 16px;position:relative;overflow:hidden;min-height:148px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 8px 28px rgba(0,0,0,.18);}
.wcard::before{content:'';position:absolute;top:-40px;right:-40px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.09);pointer-events:none;}
.wcard::after{content:'';position:absolute;top:30px;right:-20px;width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,.06);pointer-events:none;}
.wcard-top{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:1;}
.wcard-name{font-size:16px;font-weight:900;color:rgba(255,255,255,.95);letter-spacing:.5px;}
.wcard-countdown{text-align:right;}
.wcard-countdown-num{font-size:22px;font-weight:900;color:#fff;line-height:1;}
.wcard-countdown-label{font-size:10px;color:rgba(255,255,255,.7);font-weight:700;margin-top:1px;text-align:right;}
.wcard-chip{width:34px;height:26px;border-radius:5px;background:linear-gradient(135deg,rgba(255,255,255,.5) 0%,rgba(255,200,100,.6) 100%);border:1px solid rgba(255,255,255,.4);position:relative;z-index:1;}
.wcard-chip::after{content:'';position:absolute;top:50%;left:0;right:0;height:1px;background:rgba(255,255,255,.5);transform:translateY(-50%);}
.wcard-mid{position:relative;z-index:1;}
.wcard-spent-label{font-size:10px;color:rgba(255,255,255,.65);font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin-bottom:3px;}
.wcard-spent{font-size:24px;font-weight:900;color:#fff;letter-spacing:.5px;line-height:1;}
.wcard-bottom{display:flex;justify-content:space-between;align-items:flex-end;position:relative;z-index:1;}
.wcard-limit-label{font-size:10px;color:rgba(255,255,255,.6);font-weight:700;margin-bottom:3px;}
.wcard-limit{font-size:12px;color:rgba(255,255,255,.85);font-weight:800;}
.wcard-bar-wrap{flex:1;margin:0 14px 2px;}
.wcard-bar{height:4px;border-radius:4px;background:rgba(255,255,255,.2);overflow:hidden;}
.wcard-bar-fill{height:4px;border-radius:4px;background:rgba(255,255,255,.85);transition:width .4s;}
.wcard-bar-fill.danger{background:#ff8080;}
.wcard-remain-label{font-size:10px;color:rgba(255,255,255,.6);font-weight:700;margin-bottom:3px;text-align:right;}
.wcard-remain{font-size:12px;color:rgba(255,255,255,.9);font-weight:900;text-align:right;}

/* 每張卡的漸層色 */
.wc-0{background:linear-gradient(135deg,#4a4a8a 0%,#7868c8 100%);}
.wc-1{background:linear-gradient(135deg,#186888 0%,#38a8c8 100%);}
.wc-2{background:linear-gradient(135deg,#285838 0%,#4a9860 100%);}
.wc-3{background:linear-gradient(135deg,#882838 0%,#c86878 100%);}
.wc-4{background:linear-gradient(135deg,#8a5820 0%,#c89040 100%);}
.wc-5{background:linear-gradient(135deg,#385888 0%,#6898c8 100%);}
.wc-6{background:linear-gradient(135deg,#584888 0%,#9878c0 100%);}
.wc-7{background:linear-gradient(135deg,#1a6858 0%,#38a888 100%);}


/* ── 頁面切換 ── */
.page-switch{display:flex;gap:6px;margin:0 22px 14px;overflow-x:auto;scrollbar-width:none;}
.page-switch::-webkit-scrollbar{display:none;}
.page-switch button{flex:1;min-width:60px;background:var(--surface);border:2px solid var(--border);color:var(--muted);font-weight:800;font-size:11px;padding:8px 4px;border-radius:14px;cursor:pointer;font-family:inherit;transition:all .15s;white-space:nowrap;}
.page-switch button.active{background:var(--text);color:#fff;border-color:var(--text);}

/* ── 月曆 ── */
.cal-card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);margin:0 22px;padding:14px 8px 10px;}
.cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px;color:var(--muted);font-weight:700;margin-bottom:6px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);row-gap:2px;}
.cal-cell{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:3px 0;cursor:pointer;}
.cal-daynum{width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:13px;font-weight:700;color:var(--text);transition:all .12s;}
.cal-cell.dim .cal-daynum{color:#D8D2C0;}
.cal-cell.sun .cal-daynum{color:var(--blossom);}
.cal-cell.sat .cal-daynum{color:#4f9a48;}
.cal-cell.dim.sun .cal-daynum,.cal-cell.dim.sat .cal-daynum{color:#E8D8D2;}
.cal-cell.today .cal-daynum{border:2px solid var(--text);}
.cal-cell.selected .cal-daynum{background:var(--text);color:#fff;border-color:var(--text);}
.cal-dotwrap{height:6px;display:flex;align-items:center;justify-content:center;margin-top:1px;}
.cal-dot{width:4px;height:4px;border-radius:50%;background:var(--blossom);}

.cal-day-head{display:flex;justify-content:space-between;align-items:baseline;margin:16px 22px 8px;}
.cal-day-head .d{font-size:16px;font-weight:900;color:var(--text);}
.cal-day-head .t{font-size:13px;color:var(--blossom);font-weight:800;}
.expense-list{display:flex;flex-direction:column;gap:10px;}
.exp-row{background:var(--surface);display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s;}
.exp-row:active{background:var(--surface2);}
/* 外層 div 的第一個/最後一個子節點控制圓角 */
.expense-list>div:first-child .exp-row{border-radius:var(--radius) var(--radius) 0 0;}
.expense-list>div:last-child .exp-row{border-radius:0 0 var(--radius) var(--radius);border-bottom:none;}
.expense-list>div:only-child .exp-row{border-radius:var(--radius);border-bottom:none;}
.expense-list>div:last-child .exp-detail{border-bottom:none;}
.exp-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.exp-mid{flex:1;min-width:0;}
.exp-name{font-size:14px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3;}
.exp-sub{display:flex;align-items:center;gap:5px;margin-top:2px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
.exp-sub::-webkit-scrollbar{display:none;}
.exp-sub>*{flex-shrink:0;}
.exp-date{font-size:11px;color:var(--muted);font-weight:600;white-space:nowrap;flex-shrink:0;}
.exp-right{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.exp-amt{font-size:14px;font-weight:900;color:var(--blossom);white-space:nowrap;}
.exp-edit-btn{width:26px;height:26px;border-radius:50%;background:#F0EDE4;border:none;color:#9A8870;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:inherit;}

/* 展開詳情 */
.exp-detail{background:var(--surface2);padding:10px 14px 11px 32px;border-bottom:1px solid var(--border);display:none;}
.exp-detail.open{display:block;}
.exp-detail-btns{display:flex;gap:8px;margin-top:0;align-items:center;flex-wrap:wrap;}

/* 舊版 expense-card 仍用於代收帳、繳款紀錄 */
.expense-card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}
.card-header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:8px 14px;}
.card-header-person{font-size:14px;font-weight:700;justify-self:start;}
.card-header-date{font-size:12px;font-weight:700;color:var(--text);text-align:center;}
.card-header-actions{display:flex;gap:6px;justify-self:end;}
.btn-icon{background:transparent;border:none;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;font-weight:700;width:26px;height:26px;border-radius:50%;}
.btn-icon.edit{background:#F0EDE4;color:#9A8870;}
.btn-icon.del{background:var(--blossom-light);color:var(--blossom);}
.card-body{padding:10px 14px 12px;}
.card-row1{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px;}
.card-name{font-size:16px;font-weight:900;color:var(--text);flex:1;line-height:1.2;}
.card-amt{font-size:16px;font-weight:900;color:var(--blossom);white-space:nowrap;margin-left:12px;}
.card-row2{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.card-tags{display:flex;flex-wrap:wrap;gap:4px;flex:1;}
.card-note{font-size:11px;color:var(--muted);white-space:nowrap;text-align:right;flex-shrink:0;font-style:italic;}

/* header colours per person index */
.h0{background:#ede8f5;}.h0 .card-header-person{color:#9070b8;}
.h1{background:#fef5e4;}.h1 .card-header-person{color:#c8881a;}
.h2{background:#e8f5f0;}.h2 .card-header-person{color:#3a9a7a;}
.h3{background:#fde8ee;}.h3 .card-header-person{color:#c84060;}
.h4{background:#e8f2f8;}.h4 .card-header-person{color:#4878a8;}
.h5{background:#FEF6EE;}.h5 .card-header-person{color:#c87030;}
.h6{background:#F0EEF8;}.h6 .card-header-person{color:#7060b0;}
.h7{background:#EEF8F4;}.h7 .card-header-person{color:#308870;}
.h8{background:#EEF4F8;}.h8 .card-header-person{color:#3060a0;}
.h9{background:#F8EEF0;}.h9 .card-header-person{color:#b04060;}

/* pills & badges */
.pill{display:inline-block;font-size:11px;padding:2px 7px;border-radius:50px;font-weight:700;white-space:nowrap;}
[data-pi="0"]{background:#ede8f5;color:#9070b8;border:1.5px solid #d0b8de;}
[data-pi="1"]{background:#fef5e4;color:#c8881a;border:1.5px solid #f3bc72;}
[data-pi="2"]{background:#e8f5f0;color:#3a9a7a;border:1.5px solid #96d4bf;}
[data-pi="3"]{background:#fde8ee;color:#c84060;border:1.5px solid #f6a5b4;}
[data-pi="4"]{background:#e8f2f8;color:#4878a8;border:1.5px solid #79a5c8;}
[data-pi="5"]{background:var(--warning-light);color:#c87030;border:1.5px solid #F9B384;}
[data-pi="6"]{background:#F0EEF8;color:#7060b0;border:1.5px solid #C8C0E0;}
[data-pi="7"]{background:#EEF8F4;color:#308870;border:1.5px solid #88D0B8;}
[data-pi="8"]{background:#EEF4F8;color:#3060a0;border:1.5px solid #88B0D8;}
[data-pi="9"]{background:#F8EEF0;color:#b04060;border:1.5px solid #E0A8B0;}
.fixed-badge{font-size:10px;background:var(--buttercup-light);color:#5a9a30;border-radius:50px;padding:2px 7px;font-weight:700;border:1.5px solid #A6D785;display:inline-block;white-space:nowrap;flex-shrink:0;}
.inst-badge{font-size:10px;color:#7060b0;background:#F0EEF8;border-radius:50px;padding:2px 7px;font-weight:700;border:1.5px solid #C8C0E0;display:inline-block;white-space:nowrap;flex-shrink:0;}
.btn-sm{background:var(--surface2);border:1.5px solid var(--border);color:var(--muted);cursor:pointer;font-size:11px;padding:2px 9px;border-radius:50px;font-family:inherit;font-weight:700;white-space:nowrap;}
.btn-sm.done{border-color:#A6D785;color:#5a9a30;background:var(--buttercup-light);}

/* ── 代收帳 ── */
.section-header{font-size:13px;color:var(--muted);margin-bottom:12px;display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.5px;}
.section-header::after{content:'';flex:1;height:1px;background:var(--border);}
.owed-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px;}
.owed-card{background:var(--surface);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);}
.owed-name{font-size:13px;color:var(--muted);margin-bottom:8px;font-weight:700;}
.owed-amt{font-size:20px;color:#c87030;font-weight:900;letter-spacing:1px;}
.owed-count{font-size:13px;color:var(--muted);margin-top:4px;font-weight:600;}

/* ── 帳單對帳 ── */
.billing-list{display:flex;flex-direction:column;gap:16px;}
.billing-card{background:var(--surface);border-radius:var(--radius-lg);padding:20px 20px;box-shadow:var(--shadow);}
.billing-card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;}
.billing-card-info{font-size:13px;color:var(--muted);margin-top:4px;font-weight:600;}
.billing-total{font-size:22px;font-weight:900;color:var(--blossom);text-align:right;}
.billing-remaining{font-size:12px;color:var(--muted);text-align:right;margin-top:2px;font-weight:600;}
.limit-bar-bg{background:var(--surface2);border-radius:6px;height:7px;overflow:hidden;margin:10px 0 5px;border:1px solid var(--border);}
.limit-bar-fill{height:7px;border-radius:6px;}
.limit-bar-fill.safe{background:var(--buttercup);}
.limit-bar-fill.warn{background:var(--warning);}
.limit-bar-fill.danger{background:var(--blossom);}
.limit-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:14px;font-weight:600;}
.billing-date-block{margin-bottom:14px;}
.billing-date-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:10px;}
.billing-date-grid label{font-size:13px;color:var(--muted);font-weight:700;display:block;margin-bottom:5px;}
.btn-apply-full{width:100%;background:var(--surface2);border:1.5px solid var(--border);color:var(--muted);border-radius:12px;padding:11px;font-size:14px;cursor:pointer;font-family:inherit;font-weight:700;text-align:center;}
.btn-apply-full:hover{border-color:var(--text);color:var(--text);}
.billing-items{border-top:1px solid var(--border);padding-top:4px;}
.billing-stat-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);padding:8px 4px 10px;font-weight:600;}
.billing-checked-total{font-size:13px;color:#5a9a30;font-weight:700;}
.billing-item{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--border);}
.billing-item:last-child{border-bottom:none;}
.billing-item.checked{opacity:.45;}
.billing-item.checked .bi-name{text-decoration:line-through;color:var(--muted);}
.check-btn{flex-shrink:0;width:28px;height:28px;border-radius:50%;border:2px solid var(--border);background:var(--surface2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;color:transparent;transition:all .15s;}
.billing-item.checked .check-btn{background:var(--buttercup);border-color:var(--buttercup);color:#fff;}
.bi-left{flex:1;min-width:0;}
.bi-row1{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:5px;}
.bi-name{font-size:16px;font-weight:700;color:var(--text);}
.bi-amt{font-size:16px;font-weight:900;color:var(--blossom);white-space:nowrap;margin-left:10px;}
.bi-row2{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:space-between;}
.bi-tags{display:flex;gap:6px;flex-wrap:wrap;}
.bi-date{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap;}
.billing-no-items{font-size:13px;color:var(--muted);text-align:center;padding:20px 0;}

/* ── 設定頁 ── */
.settings-wrap{display:flex;flex-direction:column;gap:24px;}
.settings-section{display:flex;flex-direction:column;gap:12px;}
.settings-title{font-size:15px;font-weight:700;color:var(--muted);padding-bottom:10px;border-bottom:1.5px solid var(--border);}
.row-input{display:flex;gap:10px;align-items:center;}
.row-input input{flex:1;min-width:0;}
.salary-detail{background:var(--surface2);border-radius:14px;padding:14px 16px;}
.salary-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);}
.salary-row:last-child{border-bottom:none;padding-top:10px;}
.salary-row-label{font-size:14px;color:var(--muted);font-weight:600;}
.salary-row:last-child .salary-row-label{font-size:15px;font-weight:900;color:var(--text);}
.salary-val{font-size:15px;font-weight:900;}
.salary-val.red{color:var(--blossom);}
.salary-val.green{color:#4a8a20;}
.salary-row:last-child .salary-val{font-size:16px;}
.tag-list{display:flex;flex-wrap:wrap;gap:8px;}
.tag-item{display:inline-flex;align-items:center;gap:5px;border-radius:50px;padding:5px 11px;font-size:14px;font-weight:700;border:1.5px solid;}
.tag-item button{background:transparent;border:none;cursor:pointer;font-size:13px;color:inherit;opacity:.55;padding:0;font-family:inherit;}
.tag-add-row{display:flex;gap:10px;align-items:center;}
.tag-add-row input{flex:1;min-width:0;}
.card-table{width:100%;border-collapse:collapse;background:var(--surface);border-radius:14px;overflow:hidden;border:1.5px solid var(--border);}
.card-table th{font-size:13px;color:var(--muted);font-weight:700;padding:9px 12px;text-align:center;background:var(--surface2);}
.card-table td{padding:9px 10px;border-top:1px solid var(--border);vertical-align:middle;text-align:center;}
.card-table td:first-child{width:80px;}
.card-table td:last-child{width:70px;}
.card-table input{background:var(--surface2);border:1.5px solid var(--border);color:var(--text);border-radius:8px;padding:7px 10px;font-size:14px;font-family:inherit;outline:none;width:100%;text-align:center;}

/* ── Modal ── */
.modal-overlay{position:fixed;inset:0;background:rgba(45,45,45,.25);backdrop-filter:blur(8px);display:flex;align-items:flex-end;justify-content:center;z-index:100;}
.modal{background:var(--surface);border-radius:24px 24px 0 0;padding:20px 20px 40px;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;box-shadow:0 -6px 28px rgba(45,45,45,.1);}

.mg2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
.mgfull{margin-bottom:12px;}

/* ── Empty ── */
.empty{text-align:center;padding:48px 24px;color:var(--muted);font-size:14px;}

}

<script>
// ── 1. 全域變數定義 ──
let currentTab='overview', currentMonth=new Date(), selectedDate=new Date(), editingId=null, pendingDeleteId=null, importCandidates=[];
currentMonth.setDate(1);

const DEFAULT_PEOPLE=['我自己','懶人爸','阿肥媽','豬頭弟','小八貓'];
const DEFAULT_CARDS=['台新','現金','玉山','國泰','富邦','聯邦','華南','中信'];
const CARD_DEFAULTS={'玉山':{limit:70000,billingDay:27},'台新':{limit:30000,billingDay:2},'國泰':{limit:60000,billingDay:10},'中信':{limit:60000,billingDay:5},'聯邦':{limit:60000,billingDay:12},'富邦':{limit:100000,billingDay:8},'華南':{limit:60000,billingDay:23},'現金':{limit:0,billingDay:0}};

// ── 2. 基礎儲存與工具函式 ──
const S={
  get(k,def){try{const v=localStorage.getItem(k);return v!==null?JSON.parse(v):def;}catch{return def;}},
  set(k,v){localStorage.setItem(k,JSON.stringify(v));if(window.FB)window.FB.set(k,JSON.stringify(v));},
  del(k){localStorage.removeItem(k);if(window.FB)window.FB.del(k);}
};

let billingRanges=S.get('billing_ranges',{});

function showSyncStatus(msg,ok=false,warn=false){const el=document.getElementById('syncStatus');if(!el)return;el.textContent=msg;el.style.color=warn?'var(--warning)':ok?'var(--buttercup)':'var(--muted)';if(ok)setTimeout(()=>{if(el)el.textContent='';},3000);}
function getPeople(){return S.get('people',DEFAULT_PEOPLE);}
function getCards(){return S.get('cards',DEFAULT_CARDS);}
function savePeople(p){S.set('people',p);}
function saveCards(c){S.set('cards',c);}
function getSalary(){return S.get('salary',36884);}
function saveSalary(v){S.set('salary',v);}
function getPayments(){return S.get('card_payments',[]);}
function savePayments(d){S.set('card_payments',d);}

function getCardSettings(){const saved=S.get('card_settings',{});const m={};getCards().forEach(c=>{m[c]=Object.assign({},CARD_DEFAULTS[c]||{limit:0,billingDay:0},saved[c]||{});});return m;}
function saveCardSettings(d){S.set('card_settings',d);}

function toSlash(s){return s?s.replace(/-/g,'/'):'';} 
function toInput(s){return s?s.replace(/\//g,'-'):'';} 
function fmtSlash(d){return`${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;}
function todayInput(){const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function fmt(n){return'NT$'+Math.round(n).toLocaleString();}

function personPill(p){const i=Math.abs(getPeople().indexOf(p))%10;return`<span class="pill" data-pi="${i}">${p}</span>`;}
function cardPill(c){const i=(Math.abs(getCards().indexOf(c))+3)%10;return`<span class="pill" data-pi="${i}">${c}</span>`;}
function personHeaderClass(p){const i=Math.abs(getPeople().indexOf(p))%10;return`h${i}`;}
function getTagStyle(pi){
  const styles=['background:#ede8f5;color:#9070b8;border-color:#d0b8de;','background:#fef5e4;color:#c8881a;border-color:#f3bc72;','background:#e8f5f0;color:#3a9a7a;border-color:#96d4bf;','background:#fde8ee;color:#c84060;border-color:#f6a5b4;','background:#e8f2f8;color:#4878a8;border-color:#79a5c8;','background:#FEF6EE;color:#c87030;border-color:#F9B384;','background:#F0EEF8;color:#7060b0;border-color:#C8C0E0;','background:#EEF8F4;color:#308870;border-color:#88D0B8;','background:#EEF4F8;color:#3060a0;border-color:#88B0D8;','background:#F8EEF0;color:#b04060;border-color:#E0A8B0;'];
  return styles[pi%10];
}
function badgeStr(e){let s='';if(e.fixed)s+=`<span class="fixed-badge">固定</span>`;if(e.installment)s+=`<span class="inst-badge">第${e.instCur}/${e.instTotal}期</span>`;return s;}

function monthKey(d){return`expenses_${d.getFullYear()}_${d.getMonth()+1}`;}
function getExpenses(d){return S.get(monthKey(d||currentMonth),[]);}
function saveExpenses(data,d){S.set(monthKey(d||currentMonth),data);}
function saveExpenseByDate(expense){const parts=expense.date.split('/');const d=new Date(parseInt(parts[0]),parseInt(parts[1])-1,1);const ex=getExpenses(d);const idx=ex.findIndex(x=>x.id===expense.id);if(idx>=0){ex[idx]=expense;}else{ex.unshift(expense);}saveExpenses(ex,d);}

// ── 3. 日期範圍計算相關 ──
function shiftMonthSafe(dateStr, dir) {
  if (!dateStr) return '';
  const parts = dateStr.split('/');
  if (parts.length !== 3) return dateStr;
  const d = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1 + dir, 1);
  const maxDays = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  d.setDate(Math.min(parseInt(parts[2]), maxDays));
  return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
}

function getRangeForCurrentMonth(card, targetDate) {
  const template = billingRanges[card];
  if (!template || !template.from || !template.to) return null;
  if (!template.anchor) return template;
  const anchorParts = template.anchor.split('/');
  const anchorYear = parseInt(anchorParts[0]);
  const anchorMonth = parseInt(anchorParts[1]) - 1;
  const diffMonths = (targetDate.getFullYear() - anchorYear) * 12 + (targetDate.getMonth() - anchorMonth);
  if (diffMonths === 0) return template;
  return {from: shiftMonthSafe(template.from, diffMonths), to: shiftMonthSafe(template.to, diffMonths)};
}

function getExpensesInRange(from,to){
  if(!from||!to)return[];
  const fromDate=new Date(from.replace(/\//g,'-')),toDate=new Date(to.replace(/\//g,'-'));
  if(isNaN(fromDate)||isNaN(toDate))return[];
  const results=[],cur=new Date(fromDate.getFullYear(),fromDate.getMonth(),1);
  const endMonth=new Date(toDate.getFullYear(),toDate.getMonth(),1);
  while(cur<=endMonth){getExpenses(new Date(cur)).forEach(e=>{if(e.date&&e.date>=from&&e.date<=to)results.push(e);});cur.setMonth(cur.getMonth()+1);}
  return results;
}

function getFutureCommitted(card){const checks=getBillingChecks(card);const seen=new Set();let committed=0;for(let i=-36;i<=36;i++){const d=new Date(currentMonth.getFullYear(),currentMonth.getMonth()+i,1);d&&getExpenses(d).filter(e=>e.card===card&&!checks[e.id]).forEach(e=>{if(!seen.has(e.id)){seen.add(e.id);committed+=e.amount;}});}return committed;}
function getBillingChecks(card){return S.get(`billing_checks_${card}`,{});}
function saveBillingChecks(card,data){S.set(`billing_checks_${card}`,data);}

// ── 4. 核心計算邏輯 ──
function calcMonthlyPayable(){
  let cardTotal=0;
  getCards().filter(c=>c!=='現金').forEach(card=>{const range=getRangeForCurrentMonth(card,currentMonth);if(!range||!range.from||!range.to)return;const items=getExpensesInRange(range.from,range.to).filter(e=>e.card===card&&e.person==='我自己');cardTotal+=items.reduce((s,e)=>s+e.amount,0);});
  const cashTotal=getExpenses().filter(e=>e.card==='現金'&&e.person==='我自己').reduce((s,e)=>s+e.amount,0);
  return{cardTotal,cashTotal};
}

function updateSummary(){
  const salary=getSalary();
  const {cardTotal,cashTotal}=calcMonthlyPayable();
  const totalPayable=cardTotal+cashTotal;
  const seen=new Set();let owed=0;
  getExpenses().filter(e=>e.person!=='我自己'&&!e.paid&&e.card==='現金').forEach(e=>{if(!seen.has(e.id)){seen.add(e.id);owed+=e.amount;}});
  getCards().filter(c=>c!=='現金').forEach(card=>{const range=getRangeForCurrentMonth(card,currentMonth);if(!range||!range.from||!range.to)return;getExpensesInRange(range.from,range.to).filter(e=>e.card===card&&e.person!=='我自己'&&!e.paid).forEach(e=>{if(!seen.has(e.id)){seen.add(e.id);owed+=e.amount;}});});
  const left=salary-totalPayable;
  document.getElementById('sumSalary').textContent=fmt(salary);
  document.getElementById('sumLastCard').textContent=fmt(totalPayable);
  document.getElementById('sumLeft').textContent=fmt(left);
  document.getElementById('sumLeft').className='main-stat-val '+(left<0?'red':'green');

  // 錢包卡片
  const settings=getCardSettings();
  const stripEl=document.getElementById('cardStrip');
  if(stripEl){
    const today=new Date();
    const chips=getCards().filter(c=>c!=='現金').map((card,ci)=>{
      const s=settings[card]||{};const limit=s.limit||0;
      const billingDay=s.billingDay||0;
      // 本月帳單結算範圍內的消費
      const range=getRangeForCurrentMonth(card,currentMonth);
      const thisMonthSpent=(range&&range.from&&range.to)?getExpensesInRange(range.from,range.to).filter(e=>e.card===card).reduce((sum,e)=>sum+e.amount,0):0;
      // 帳單日倒數
      let countdown='—', countdownLabel='帳單日';
      if(billingDay>0){
        const bd=new Date(today.getFullYear(),today.getMonth(),billingDay);
        if(bd<=today) bd.setMonth(bd.getMonth()+1);
        const diff=Math.ceil((bd-today)/(1000*60*60*24));
        countdown=diff; countdownLabel=`天後帳單日`;
      }
      const pct=limit>0?Math.min(100,Math.round(thisMonthSpent/limit*100)):0;
      const remaining=limit-thisMonthSpent;
      const barCls=pct>=90?'danger':'';
      const wc=`wc-${ci%8}`;
      if(!limit) return`<div class="wcard ${wc}">
        <div class="wcard-top"><span class="wcard-name">${card}</span><div class="wcard-countdown"><div class="wcard-countdown-num">${countdown}</div><div class="wcard-countdown-label">${countdownLabel}</div></div></div>
        <div class="wcard-mid"><div class="wcard-spent-label">本期消費</div><div class="wcard-spent">${fmt(thisMonthSpent)}</div></div>
        <div class="wcard-bottom"><div><div class="wcard-limit-label">額度</div><div class="wcard-limit">未設定</div></div></div>
      </div>`;
      return`<div class="wcard ${wc}">
        <div class="wcard-top">
          <div><div class="wcard-chip"></div></div>
          <div class="wcard-countdown"><div class="wcard-countdown-num">${countdown}</div><div class="wcard-countdown-label">${countdownLabel}</div></div>
        </div>
        <div class="wcard-mid"><div class="wcard-spent-label">${card} · 本期消費</div><div class="wcard-spent">${fmt(thisMonthSpent)}</div></div>
        <div class="wcard-bottom">
          <div><div class="wcard-limit-label">信用額度</div><div class="wcard-limit">${fmt(limit)}</div></div>
          <div class="wcard-bar-wrap"><div class="wcard-bar"><div class="wcard-bar-fill ${barCls}" style="width:${pct}%"></div></div></div>
          <div><div class="wcard-remain-label">剩餘</div><div class="wcard-remain">${fmt(remaining)}</div></div>
        </div>
      </div>`;
    }).join('');
    stripEl.innerHTML=chips||'<div style="font-size:13px;color:var(--muted);padding:10px 0;">尚未設定信用卡</div>';
  }
}

function autoCarryInstallments(){
  const ex=getExpenses();
  const lastMonth=new Date(currentMonth.getFullYear(),currentMonth.getMonth()-1,1);
  const lastEx=getExpenses(lastMonth);
  const pendingInst=lastEx.filter(e=>e.installment&&e.instCur&&e.instTotal&&e.instCur<e.instTotal);
  if(!pendingInst.length)return;
  const existingSources=new Set(ex.filter(e=>e.sourceId).map(e=>e.sourceId));
  const existingOrigins=new Set(ex.filter(e=>e.originId).map(e=>e.originId));
  let added=0;
  pendingInst.forEach(e=>{const origin=e.originId||e.id;if(existingSources.has(e.id)||existingOrigins.has(origin))return;const nextCur=e.instCur+1;const origDay=parseInt((e.date||'').split('/')[2]||'1');const y=currentMonth.getFullYear(),m=currentMonth.getMonth();const day=Math.min(origDay,new Date(y,m+1,0).getDate());const date=`${y}/${String(m+1).padStart(2,'0')}/${String(day).padStart(2,'0')}`;ex.push({...e,id:Date.now()+Math.random(),sourceId:e.id,originId:origin,date,paid:false,instCur:nextCur});added++;});
  if(added>0)saveExpenses(ex);
}

    const checkedCount=allItems.filter(e=>checks[e.id]).length;

function parseDateStr(s){
  if(!s)return null;
  const p=s.split('/').map(n=>parseInt(n,10));
  return new Date(p[0],p[1]-1,p[2]);
}
function sameDay(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();}
function daysInMonth(y,m){return new Date(y,m+1,0).getDate();}

function expensesOnDate(d){
  return getExpenses(d).filter(e=>{const p=parseDateStr(e.date);return p&&sameDay(p,d);});
}

function renderCalendar(){
  const grid=document.getElementById('calGrid');
  if(!grid)return;
  const y=currentMonth.getFullYear(), m=currentMonth.getMonth();
  const firstWeekday=new Date(y,m,1).getDay();
  const totalDays=daysInMonth(y,m);
  const prevTotalDays=new Date(y,m,0).getDate();
  const cells=[];
  // 上個月補齊
  for(let i=0;i<firstWeekday;i++){
    const dnum=prevTotalDays-firstWeekday+1+i;
    const dObj=new Date(y,m-1,dnum);
    cells.push({date:dObj,dim:true});
  }
  // 本月
  for(let d=1;d<=totalDays;d++){
    cells.push({date:new Date(y,m,d),dim:false});
  }
  // 補齊到 7 的倍數
  let next=1;
  while(cells.length%7!==0){
    cells.push({date:new Date(y,m+1,next),dim:true});
    next++;
  }
  const today=new Date();
  grid.innerHTML=cells.map(c=>{
    const wd=c.date.getDay();
    const isToday=sameDay(c.date,today);
    const isSel=sameDay(c.date,selectedDate);
    const has=expensesOnDate(c.date).length>0;
    let cls='cal-cell';
    if(c.dim)cls+=' dim';
    if(wd===0)cls+=' sun'; else if(wd===6)cls+=' sat';
    if(isToday)cls+=' today';
    if(isSel)cls+=' selected';
    return`<div class="${cls}" onclick="selectDay(${c.date.getFullYear()},${c.date.getMonth()},${c.date.getDate()})">
      <div class="cal-daynum">${c.date.getDate()}</div>
      <div class="cal-dotwrap">${has?'<span class="cal-dot"></span>':''}</div>
    </div>`;
  }).join('');
}

function selectDay(y,m,d){
  const target=new Date(y,m,d);
  if(target.getFullYear()!==currentMonth.getFullYear()||target.getMonth()!==currentMonth.getMonth()){
    currentMonth=new Date(target.getFullYear(),target.getMonth(),1);
    document.getElementById('monthLabel').textContent=`${currentMonth.getFullYear()}/${String(currentMonth.getMonth()+1).padStart(2,'0')}`;

}

function importFixed() {
  const targetDateVal = document.getElementById('imp-target-date').value;
  if(!targetDateVal) { alert('請選擇要寫入的消費日期！'); return; }

  const checkedBoxes = Array.from(document.querySelectorAll('.imp-item-cbx:checked'));
  if(checkedBoxes.length===0) { alert('請至少選擇一項要匯入的固定支出！'); return; }

  const tParts = targetDateVal.split('-');
  const targetYear = parseInt(tParts[0]);
  const targetMonth = parseInt(tParts[1]);
  const targetDay = parseInt(tParts[2]);
  const targetM = new Date(targetYear, targetMonth - 1, 1);
  const currentList = getExpenses(targetM);
  const formattedTargetDate = `${targetYear}/${targetMonth}/${targetDay}`;

  // 💡 安全防護：使用基礎底層時間戳記，在迴圈內部透過逐步遞增，保證 ID 絕對唯一且不碰撞
  const baseTimestamp = Date.now();
  let count = 0;

  checkedBoxes.forEach((cb)=>{
    const idx=parseInt(cb.dataset.idx);
    const p=importCandidates[idx];
    if(!p)return;
    const uniqueId = Number(`${baseTimestamp}${idx}`) + Math.floor(Math.random() * 100000);
    currentList.unshift(Object.assign({}, p, {id: uniqueId, date: formattedTargetDate, paid: false}));
    count++;
  });

  if(count > 0) {
    saveExpenses(currentList, targetM);
    if(targetM.getFullYear() === currentMonth.getFullYear() && targetM.getMonth() === currentMonth.getMonth()) {
      render();
      if(typeof updateSummary === 'function') updateSummary();
    }
    closeImportModal();
    closeAddSheet();
    alert(`已成功匯入 ${count} 筆固定支出至 ${formattedTargetDate}！`);
  } else {
    alert('未成功匯入項目。');
  }
}

    storageBucket:"budget-flow-629f4.firebasestorage.app",
    messagingSenderId:"646229662175",
    appId:"1:646229662175:web:a12dd9e0515d0a75788c6a"
  };
  
  try{
    if(typeof firebase==='undefined') throw new Error('firebase not loaded');
    firebase.initializeApp(firebaseConfig);
    const db=firebase.firestore();
    const USER='default';
    
    window.FB={
      async get(key){try{const s=await db.collection(USER).doc(key).get();return s.exists?s.data().value:null;}catch(e){console.warn('FB.get',e);return null;}},
      async set(key,value){try{await db.collection(USER).doc(key).set({value:value});}catch(e){console.warn('FB.set',e);}},
      async del(key){try{await db.collection(USER).doc(key).delete();}catch(e){console.warn('FB.del',e);}}
    };
    
    showSyncStatus('雲端同步中...',false);
    
    // 定義所有需要跟雲端同步下載的 Key（包含你的區間設定 billing_ranges）
    const cloudKeys=['people','cards','card_settings','salary','billing_ranges'];
    
    // 動態打包前後半年的帳目月份進行同步下載
    const m=new Date();
    for(let i=-6; i<=6; i++){
      const td=new Date(m.getFullYear(), m.getMonth()+i, 1);
      cloudKeys.push(`expenses_${td.getFullYear()}_${td.getMonth()+1}`);
    }
    
    // 從 Firebase 撈出最新資料，強行更新本地端儲存，防止設定與帳目跑掉
    let hasChanges = false;
    for(const k of cloudKeys){
      const cloudVal = await window.FB.get(k);
      if(cloudVal !== null) {
        localStorage.setItem(k, cloudVal); 
        hasChanges = true;
      }
    }
    
    // 如果發現雲端資料有更新，立刻刷新畫面顯示最新狀態
    if(hasChanges){
      billingRanges=S.get('billing_ranges',{}); // 鎖定區間設定不跑移
      autoCarryInstallments();
      render();
      if(typeof updateSummary === 'function') updateSummary();
    }
    
    showSyncStatus('已同步 ✓',true);
    
  }catch(e){
    showSyncStatus('離線模式',false,true);
    console.warn('Firebase sync failed:',e);
  }
});
</script>
