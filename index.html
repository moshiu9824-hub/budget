<!DOCTYPE html>
<html lang="zh-TW" style="color-scheme:light;">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<link rel="apple-touch-icon" href="icon.png"/>
<link rel="icon" href="icon.png"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="錢去哪了"/>
<title>錢去哪了</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F5EE;--surface:#ffffff;--surface2:#F0EDE4;--border:#E8E4D8;--text:#1A1A1A;--muted:#9A8870;
  --blossom:#EF6F5D;--blossom-light:#FEF3EE;--bubbles:#93D6ED;--bubbles-light:#EEF9FD;
  --buttercup:#A6D785;--buttercup-light:#F0F9E8;--warning:#F9B384;--warning-light:#FEF6EE;
  --deco-pink-light:#FEF0F7;--deco-yellow-light:#FFFDE8;
  --danger:#EF6F5D;--danger-light:#FEF3EE;
  --radius:16px;--radius-lg:24px;
  --shadow:0 2px 12px rgba(45,45,45,.08);--shadow-lg:0 4px 24px rgba(45,45,45,.10),0 1px 4px rgba(45,45,45,.06);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow-x:hidden;overflow-y:auto;color-scheme:light;}
body{background:var(--bg);color:var(--text);font-family:'Inter','Noto Sans TC',sans-serif;font-size:15px;}
.app{display:flex;flex-direction:column;max-width:520px;margin:0 auto;}

/* ── Header ── */
header{padding:28px 22px 16px;display:flex;align-items:center;justify-content:space-between;}
.logo{font-size:22px;font-weight:900;color:var(--text);letter-spacing:-0.5px;display:flex;align-items:center;gap:10px;}
.logo-dot{width:12px;height:12px;border-radius:50%;background:var(--blossom);}
#syncStatus{font-size:11px;color:var(--muted);font-weight:600;margin-left:8px;}
.month-nav{display:flex;align-items:center;gap:10px;}
.month-nav button{background:var(--surface);border:2px solid var(--border);color:var(--muted);width:38px;height:38px;border-radius:50%;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:inherit;transition:all .15s;}
.month-nav button:hover{background:var(--blossom);color:#fff;border-color:var(--blossom);}
.month-label{font-size:16px;color:var(--muted);font-weight:700;min-width:80px;text-align:center;letter-spacing:1px;}

/* ── 大摘要卡片 ── */
.main-card{margin:0 22px 8px;background:var(--surface);border-radius:20px;padding:13px 16px;box-shadow:var(--shadow-lg);position:relative;overflow:hidden;}
.main-card::before{content:"";position:absolute;width:100px;height:100px;border-radius:50%;top:-30px;right:-30px;background:var(--bubbles);opacity:0.08;}
.main-label{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.5px;margin-bottom:3px;}
.main-amount{font-size:18px;font-weight:900;color:var(--text);letter-spacing:1px;line-height:1;margin-bottom:11px;}
.main-row{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--border);padding-top:10px;}
.main-stat{display:flex;flex-direction:column;gap:2px;}
.main-stat:first-child{padding-right:12px;border-right:1px solid var(--border);}
.main-stat:last-child{padding-left:12px;}
.main-stat-val{font-size:14px;font-weight:900;letter-spacing:1px;line-height:1;}
.main-stat-val.green{color:#5a9a30;}
.main-stat-val.red{color:#e15d5e;}
.main-stat-label{font-size:11px;color:var(--muted);font-weight:700;}

/* ── 代墊未收條 ── */
.owed-bar{margin:0 22px;background:var(--surface);border-radius:14px;padding:10px 16px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-between;}
.owed-bar-label{font-size:12px;color:var(--muted);font-weight:700;}
.owed-bar-val{font-size:14px;font-weight:900;color:#c07020;letter-spacing:1px;}

/* ── 分頁標籤 ── */
.tabs-wrap{padding:8px 22px 0;}
.tabs{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;background:#EDE8D8;border-radius:50px;padding:10px 6px;border:1.5px solid #D8D0C0;}
.tab{font-size:13px;font-weight:700;cursor:pointer;border:none;background:transparent;color:#dbc8a1;white-space:nowrap;text-align:center;width:100%;font-family:inherit;padding:0;line-height:1;transition:color .15s;}
.tab.active{color:#9f754e;}

/* ── Main content ── */
.main{padding:10px 22px 100px;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}

/* ── 新增表單 ── */
.add-form{background:var(--surface);border-radius:var(--radius-lg);padding:22px 20px;margin-bottom:16px;box-shadow:var(--shadow);}
.add-form-title{font-size:15px;font-weight:700;color:var(--muted);margin-bottom:18px;display:flex;align-items:center;justify-content:space-between;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
.gfull{margin-bottom:14px;}
label{font-size:14px;color:var(--muted);display:block;margin-bottom:6px;font-weight:700;letter-spacing:.2px;}
input,select,textarea{width:100%;background:var(--surface2);border:1.5px solid var(--border);color:var(--text);border-radius:12px;padding:12px 14px;font-size:15px;font-family:inherit;outline:none;transition:border-color .15s;-webkit-appearance:none;appearance:none;color-scheme:light;}
input[type="date"],input[type="month"]{background:#fff!important;color-scheme:light!important;}
input:focus,select:focus,textarea:focus{border-color:var(--bubbles);}
textarea{resize:none;height:68px;line-height:1.5;}
.btn{border:none;border-radius:12px;padding:11px 18px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;transition:all .15s;}
.btn-primary{background:var(--text);color:#fff;}
.btn-primary:hover{background:#333;}
.btn-secondary{background:var(--surface2);border:1.5px solid var(--border);color:var(--muted);}
.btn-secondary:hover{border-color:var(--text);color:var(--text);}
.btn-danger-soft{background:var(--danger-light);border:1.5px solid #f5c0b0;color:var(--danger);}
.checkbox-label{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);cursor:pointer;white-space:nowrap;font-weight:700;}
.checkbox-label input[type=checkbox]{width:16px;height:16px;accent-color:var(--blossom);-webkit-appearance:auto;appearance:auto;}

/* ── 明細卡片 ── */
.expense-list{display:flex;flex-direction:column;gap:12px;}
.expense-card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}
.card-header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:10px 14px;}
.card-header-person{font-size:15px;font-weight:700;justify-self:start;}
.card-header-date{font-size:13px;font-weight:700;color:var(--text);text-align:center;}
.card-header-actions{display:flex;gap:6px;justify-self:end;}
.btn-icon{background:transparent;border:none;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;font-weight:700;width:26px;height:26px;border-radius:50%;}
.btn-icon.edit{background:#F0EDE4;color:#9A8870;}
.btn-icon.del{background:var(--blossom-light);color:var(--blossom);}
.card-body{padding:12px 16px 14px;}
.card-row1{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px;}
.card-name{font-size:19px;font-weight:900;color:var(--text);flex:1;line-height:1.2;}
.card-amt{font-size:19px;font-weight:900;color:var(--blossom);white-space:nowrap;margin-left:12px;}
.card-row2{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.card-tags{display:flex;flex-wrap:wrap;gap:6px;flex:1;}
.card-note{font-size:12px;color:var(--muted);white-space:nowrap;text-align:right;flex-shrink:0;font-style:italic;}

/* header colours per person index */
.h0{background:#ede8f5;}.h0 .card-header-person{color:#9070b8;}
.h1{background:#fef5e4;}.h1 .card-header-person{color:#c8881a;}
.h2{background:#e8f5f0;}.h2 .card-header-person{color:#3a9a7a;}
.h3{background:#fde8ee;}.h3 .card-header-person{color:#c84060;}
.h4{background:#e8f2f8;}.h4 .card-header-person{color:#4878a8;}
.h5{background:#FEF6EE;}.h5 .card-header-person{color:#c87030;}
.h6{background:#F0EEF8;}.h6 .card-header-person{color:#7060b0;}
.h7{background:#EEF8F4;}.h7 .card-header-person{color:#308870;}
.h8{background:#EEF4F8;}.h8 .card-header-person{color:#3060a0;}
.h9{background:#F8EEF0;}.h9 .card-header-person{color:#b04060;}

/* pills & badges */
.pill{display:inline-block;font-size:12px;padding:3px 10px;border-radius:50px;font-weight:700;white-space:nowrap;}
[data-pi="0"]{background:#ede8f5;color:#9070b8;border:1.5px solid #d0b8de;}
[data-pi="1"]{background:#fef5e4;color:#c8881a;border:1.5px solid #f3bc72;}
[data-pi="2"]{background:#e8f5f0;color:#3a9a7a;border:1.5px solid #96d4bf;}
[data-pi="3"]{background:#fde8ee;color:#c84060;border:1.5px solid #f6a5b4;}
[data-pi="4"]{background:#e8f2f8;color:#4878a8;border:1.5px solid #79a5c8;}
[data-pi="5"]{background:var(--warning-light);color:#c87030;border:1.5px solid #F9B384;}
[data-pi="6"]{background:#F0EEF8;color:#7060b0;border:1.5px solid #C8C0E0;}
[data-pi="7"]{background:#EEF8F4;color:#308870;border:1.5px solid #88D0B8;}
[data-pi="8"]{background:#EEF4F8;color:#3060a0;border:1.5px solid #88B0D8;}
[data-pi="9"]{background:#F8EEF0;color:#b04060;border:1.5px solid #E0A8B0;}
.fixed-badge{font-size:11px;background:var(--buttercup-light);color:#5a9a30;border-radius:50px;padding:3px 9px;font-weight:700;border:1.5px solid #A6D785;display:inline-block;}
.inst-badge{font-size:11px;color:#7060b0;background:#F0EEF8;border-radius:50px;padding:3px 9px;font-weight:700;border:1.5px solid #C8C0E0;display:inline-block;}

/* ── 代收帳 ── */
.section-header{font-size:13px;color:var(--muted);margin-bottom:12px;display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.5px;}
.section-header::after{content:'';flex:1;height:1px;background:var(--border);}
.owed-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px;}
.owed-card{background:var(--surface);border-radius:var(--radius);padding:166px 16px; padding:16px;box-shadow:var(--shadow);}
.owed-name{font-size:13px;color:var(--muted);margin-bottom:8px;font-weight:700;}
.owed-amt{font-size:20px;color:#c87030;font-weight:900;letter-spacing:1px;}
.owed-count{font-size:13px;color:var(--muted);margin-top:4px;font-weight:600;}

/* ── 帳單對帳 ── */
.billing-list{display:flex;flex-direction:column;gap:16px;}
.billing-card{background:var(--surface);border-radius:var(--radius-lg);padding:20px 20px;box-shadow:var(--shadow);}
.billing-card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;}
.billing-card-info{font-size:13px;color:var(--muted);margin-top:4px;font-weight:600;}
.billing-total{font-size:22px;font-weight:900;color:var(--blossom);text-align:right;}
.billing-remaining{font-size:12px;color:var(--muted);text-align:right;margin-top:2px;font-weight:600;}
.limit-bar-bg{background:var(--surface2);border-radius:6px;height:7px;overflow:hidden;margin:10px 0 5px;border:1px solid var(--border);}
.limit-bar-fill{height:7px;border-radius:6px;}
.limit-bar-fill.safe{background:var(--buttercup);}
.limit-bar-fill.warn{background:var(--warning);}
.limit-bar-fill.danger{background:var(--blossom);}
.limit-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:14px;font-weight:600;}
.billing-items{border-top:1px solid var(--border);padding-top:4px;}
.billing-item{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--border);}
.billing-item:last-child{border-bottom:none;}
.bi-left{flex:1;min-width:0;}
.bi-row1{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:5px;}
.bi-name{font-size:16px;font-weight:700;color:var(--text);}
.bi-amt{font-size:16px;font-weight:900;color:var(--blossom);white-space:nowrap;margin-left:10px;}
.bi-row2{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:space-between;}
.bi-date{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap;}
.billing-no-items{font-size:13px;color:var(--muted);text-align:center;padding:20px 0;}

/* ── 設定頁 ── */
.settings-wrap{display:flex;flex-direction:column;gap:24px;}
.settings-section{display:flex;flex-direction:column;gap:12px;}
.settings-title{font-size:15px;font-weight:700;color:var(--muted);padding-bottom:10px;border-bottom:1.5px solid var(--border);}
.row-input{display:flex;gap:10px;align-items:center;}
.row-input input{flex:1;min-width:0;}
.card-table{width:100%;border-collapse:collapse;background:var(--surface);border-radius:14px;overflow:hidden;border:1.5px solid var(--border);}
.card-table th{font-size:13px;color:var(--muted);font-weight:700;padding:9px 12px;text-align:center;background:var(--surface2);}
.card-table td{padding:9px 10px;border-top:1px solid var(--border);vertical-align:middle;text-align:center;}
.card-table td:first-child{width:80px;}
.card-table td:last-child{width:70px;}
.card-table input{background:var(--surface2);border:1.5px solid var(--border);color:var(--text);border-radius:8px;padding:7px 10px;font-size:14px;font-family:inherit;outline:none;width:100%;text-align:center;}

/* ── Modal ── */
.modal-overlay{position:fixed;inset:0;background:rgba(45,45,45,.25);backdrop-filter:blur(8px);display:flex;align-items:flex-end;justify-content:center;z-index:100;}
.modal{background:var(--surface);border-radius:24px 24px 0 0;padding:20px 20px 40px;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;box-shadow:0 -6px 28px rgba(45,45,45,.1);}
.modal-handle{width:36px;height:4px;background:var(--border);border-radius:3px;margin:0 auto 18px;}
.modal-title{font-size:16px;font-weight:700;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;}
.modal-actions{display:flex;gap:8px;margin-top:16px;}
.modal-actions .btn{flex:1;padding:13px;}
.mg2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
.mgfull{margin-bottom:12px;}

@media(max-width:640px){
  html,body{height:100%;overflow:hidden;}
  .app{width:100%;height:100vh;display:flex;flex-direction:column;position:fixed;top:0;left:0;right:0;bottom:0;}
  .main{overflow-y:scroll;-webkit-overflow-scrolling:touch;flex:1;min-height:0;}
}

/* ── 浮動新增按鈕 ── */
.fab{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);width:calc(100% - 44px);max-width:476px;background:var(--text);color:#fff;border:none;border-radius:50px;padding:16px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 6px 24px rgba(26,26,26,.28);z-index:50;display:flex;align-items:center;justify-content:center;gap:8px;}
.overlay{position:fixed;inset:0;background:rgba(45,45,45,.2);backdrop-filter:blur(4px);z-index:55;display:none;}
.overlay.open{display:block;}
.form-sheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:var(--surface);border-radius:24px 24px 0 0;padding:18px 20px 44px;box-shadow:0 -6px 28px rgba(45,45,45,.15);z-index:60;display:none;max-height:92vh;overflow-y:auto;}
.form-sheet.open{display:block;}
.sheet-handle{width:36px;height:4px;background:var(--border);border-radius:3px;margin:0 auto 16px;}
.sheet-title{font-size:15px;font-weight:700;color:var(--muted);margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;}
.btn-sheet-close{background:var(--surface2);border:1.5px solid var(--border);color:var(--muted);border-radius:50%;width:30px;height:30px;font-size:16px;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.sheet-g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
.sheet-gfull{margin-bottom:12px;}
.sheet-bottom{display:flex;align-items:center;gap:14px;flex-wrap:nowrap;margin-top:4px;}
.sheet-cbx{display:flex;align-items:center;gap:5px;font-size:14px;color:var(--muted);font-weight:700;white-space:nowrap;cursor:pointer;}
.sheet-cbx input[type=checkbox]{width:16px;height:16px;accent-color:var(--blossom);-webkit-appearance:auto;appearance:auto;flex-shrink:0;}
</style>
<script>
function loadScript(src){return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=reject;document.head.appendChild(s);});}
window._firebaseLoader=loadScript('https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js').then(()=>loadScript('https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js')).catch(e=>console.warn('Firebase CDN load failed:',e));
</script>
</head>
<body>
<div class="app">
  <header>
    <div style="display:flex;align-items:center;">
      <div class="logo"><span class="logo-dot"></span>錢去哪了</div>
      <span id="syncStatus"></span>
    </div>
    <div class="month-nav">
      <button onclick="changeMonth(-1)">‹</button>
      <span class="month-label" id="monthLabel"></span>
      <button onclick="changeMonth(1)">›</button>
    </div>
  </header>

  <div class="main-card">
    <div class="main-label">本月薪資</div>
    <div class="main-amount" id="sumSalary">—</div>
    <div class="main-row">
      <div class="main-stat">
        <div class="main-stat-val green" id="sumLeft">—</div>
        <div class="main-stat-label">薪資剩餘</div>
      </div>
      <div class="main-stat">
        <div class="main-stat-val red" id="sumLastCard">—</div>
        <div class="main-stat-label">本月應繳</div>
      </div>
    </div>
  </div>

  <div style="height:6px;"></div>

  <div class="owed-bar">
    <div class="owed-bar-label">代墊未收</div>
    <div class="owed-bar-val" id="sumOwed">—</div>
  </div>

  <div class="tabs-wrap">
    <div class="tabs">
      <button class="tab active" id="tab-list" onclick="switchTab('list')">明細表</button>
      <button class="tab" id="tab-owed" onclick="switchTab('owed')">代收帳</button>
      <button class="tab" id="tab-billing" onclick="switchTab('billing')">對帳單</button>
      <button class="tab" id="tab-settings" onclick="switchTab('settings')">設定區</button>
    </div>
  </div>

  <div class="main" id="mainContent"></div>
</div>

<button class="fab" id="fabBtn" onclick="openAddSheet()">＋ 新增記帳</button>

<div class="overlay" id="overlay" onclick="closeAddSheet()"></div>

<div class="form-sheet" id="addSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-title">
    <span>新增記帳</span>
    <div style="display:flex;gap:8px;align-items:center;">
      <button class="btn btn-secondary" style="font-size:12px;padding:6px 12px;" onclick="openImportModal()">↓ 匯入固定支出</button>
      <button class="btn-sheet-close" onclick="closeAddSheet()">✕</button>
    </div>
  </div>
  <div class="sheet-g2">
    <div><label>品項</label><input id="f-name" placeholder="例：晚餐"/></div>
    <div><label>金額</label><input id="f-amount" type="number" placeholder="0"/></div>
  </div>
  <div class="sheet-gfull"><label>消費日期</label><input id="f-date" type="date" value="" style="background:#fff;color-scheme:light;"/></div>
  <div class="sheet-g2">
    <div><label>付款方式</label><select id="f-card"></select></div>
    <div><label>誰的帳</label><select id="f-person"></select></div>
  </div>
  <div class="sheet-gfull"><label>備註（選填）</label><textarea id="f-note" placeholder="例：實際刷卡日4/30，5/2才入帳"></textarea></div>
  <div class="sheet-bottom">
    <label class="sheet-cbx"><input type="checkbox" id="f-fixed"> 固定支出</label>
    <label class="sheet-cbx"><input type="checkbox" id="f-inst" onchange="toggleAddInst()"> 分期</label>
    <div id="f-inst-fields" style="display:none;">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
        <div><label>第幾期</label><input id="f-inst-cur" type="number" placeholder="1" min="1"/></div>
        <div><label>共幾期</label><input id="f-inst-total" type="number" placeholder="12" min="1"/></div>
      </div>
    </div>
    <button class="btn btn-primary" style="margin-left:auto;flex-shrink:0;" onclick="addExpense()">新增</button>
  </div>
</div>

<div class="modal-overlay" id="importFixedModal" style="display:none; z-index:70;" onclick="if(event.target.id==='importFixedModal') closeImportModal()">
  <div class="modal" style="max-width:360px; border-radius:24px; padding:20px 20px 30px;">
    <div class="modal-handle"></div>
    <div style="font-size:15px; font-weight:700; color:var(--text); margin-bottom:14px;">⚙️ 匯入固定支出設定</div>
    <div class="mgfull">
      <label>1. 選擇資料來源月份</label>
      <input type="month" id="imp-source-month" style="background:#fff; color-scheme:light;"/>
    </div>
    <div class="mgfull">
      <label>2. 設定寫入本月的消費日期</label>

    </div>

  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">編輯記帳 <button class="btn-icon del" onclick="closeModal()">✕</button></div>
    <div class="mg2">
      <div><label>品項</label><input id="e-name"/></div>
      <div><label>金額</label><input id="e-amount" type="number"/></div>
    </div>
    <div class="mgfull"><label>消費日期</label><input id="e-date" type="date" style="background:#fff;color-scheme:light;"/></div>
    <div class="mg2">
      <div><label>付款方式</label><select id="e-card"></select></div>
      <div><label>誰的帳</label><select id="e-person"></select></div>
    </div>

      <div><label>第幾期</label><input id="e-inst-cur" type="number" min="1"/></div>
      <div><label>共幾期</label><input id="e-inst-total" type="number" min="1"/></div>
    </div>

      <button class="btn btn-secondary" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="saveEdit()">儲存</button>

</div>

<div class="modal-overlay" id="confirmModal" style="display:none;">
  <div class="modal" style="max-width:340px;border-radius:24px;padding:24px 20px 24px;">
    <div class="modal-handle"></div>
    <div style="text-align:center;margin-bottom:20px;">
      <div style="font-size:28px;margin-bottom:10px;">🗑️</div>
      <div style="font-size:16px;font-weight:700;margin-bottom:6px;" id="confirmMsg">確定刪除？</div>
      <div style="font-size:13px;color:var(--muted);">刪除後無法復原</div>
    </div>

      <button class="btn btn-secondary" style="flex:1;" onclick="cancelDelete()">取消</button>
      <button class="btn btn-danger-soft" style="flex:1;" onclick="confirmDelete()">確定刪除</button>
    </div>
  </div>
</div>

<script>
const S={
  get(k,def){try{const v=localStorage.getItem(k);return v!==null?JSON.parse(v):def;}catch{return def;}},
  set(k,v){localStorage.setItem(k,JSON.stringify(v));if(window.FB)window.FB.set(k,JSON.stringify(v));},
  del(k){localStorage.removeItem(k);if(window.FB)window.FB.del(k);}
};

function showSyncStatus(msg,ok=false,warn=false){
  const el=document.getElementById('syncStatus');if(!el)return;
  el.textContent=msg;el.style.color=warn?'var(--warning)':ok?'var(--buttercup)':'var(--muted)';
  if(ok)setTimeout(()=>{if(el)el.textContent='';},3000);
}

let currentTab='list',currentMonth=new Date(),billingRanges=S.get('billing_ranges',{}),editingIndex=null,deletingIndex=null;
currentMonth.setDate(1);

const DEFAULT_PEOPLE=['我自己','懶人爸','阿肥媽','豬頭弟','小八貓'];
const DEFAULT_CARDS=['台新','現金','玉山','國泰','富邦','聯邦','華南','中信'];
const CARD_DEFAULTS={'玉山':{limit:70000,billingDay:27},'台新':{limit:30000,billingDay:2},'國泰':{limit:60000,billingDay:10},'中信':{limit:60000,billingDay:5},'聯邦':{limit:60000,billingDay:12},'富邦':{limit:100000,billingDay:8},'華南':{limit:60000,billingDay:23},'現金':{limit:0,billingDay:0}};

function getPeople(){return S.get('people',DEFAULT_PEOPLE);}
function getCards(){return S.get('cards',DEFAULT_CARDS);}
function personPill(p){const i=Math.abs(getPeople().indexOf(p))%10;return`<span class="pill" data-pi="${i}">${p}</span>`;}
function cardPill(c){const i=(Math.abs(getCards().indexOf(c))+3)%10;return`<span class="pill" data-pi="${i}">${c}</span>`;}
function personHeaderClass(p){const i=Math.abs(getPeople().indexOf(p))%10;return`h${i}`;}
function monthKey(d){return`expenses_${d.getFullYear()}_${d.getMonth()+1}`;}
function getExpenses(d){return S.get(monthKey(d||currentMonth),[]);}
function saveExpenses(data,d){S.set(monthKey(d||currentMonth),data);}

function getSalary(){return S.get('salary',36884);}
function saveSalary(v){S.set('salary',v);updateSummary();}
function getCardSettings(){
  const saved=S.get('card_settings',{});const m={};
  getCards().forEach(c=>{m[c]=Object.assign({},CARD_DEFAULTS[c]||{limit:0,billingDay:0},saved[c]||{});});
  return m;
}
function saveCardSettings(d){S.set('card_settings',d);updateSummary();if(currentTab==='billing'||currentTab==='settings')render();}

function toSlash(s){return s?s.replace(/-/g,'/'):'';}
function toInput(s){return s?s.replace(/\//g,'-'):'';}
function fmtSlash(d){
  if(!d)return'';
  const parts=d.split('/');
  if(parts.length===3)return`${parts[0]}/${String(parts[1]).padStart(2,'0')}/${String(parts[2]).padStart(2,'0')}`;
  return d;
}

function openAddSheet(){
  document.getElementById('f-date').value=new Date().toISOString().split('T')[0];
  document.getElementById('f-name').value='';
  document.getElementById('f-amount').value='';
  document.getElementById('f-note').value='';
  document.getElementById('f-fixed').checked=false;
  document.getElementById('f-inst').checked=false;
  document.getElementById('f-inst-fields').style.display='none';
  document.getElementById('overlay').classList.add('open');
  document.getElementById('addSheet').classList.add('open');
}
function closeAddSheet(){
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('addSheet').classList.remove('open');
}
function toggleAddInst(){
  document.getElementById('f-inst-fields').style.display=document.getElementById('f-inst').checked?'block':'none';
}
function toggleEditInst(){
  document.getElementById('e-inst-fields').style.display=document.getElementById('e-inst').checked?'grid':'none';
}

function renderOptions(){
  const fp=document.getElementById('f-person'),fc=document.getElementById('f-card');
  const ep=document.getElementById('e-person'),ec=document.getElementById('e-card');
  if(!fp)return;
  const pOpt=getPeople().map(p=>`<option value="${p}">${p}</option>`).join('');
  const cOpt=getCards().map(c=>`<option value="${c}">${c}</option>`).join('');
  fp.innerHTML=pOpt; ep.innerHTML=pOpt;
  fc.innerHTML=cOpt; ec.innerHTML=cOpt;
}

function switchTab(t){
  currentTab=t;
  document.querySelectorAll('.tab').forEach(el=>el.classList.remove('active'));
  const targetTab=document.getElementById(`tab-${t}`);
  if(targetTab) targetTab.classList.add('active');
  render();
}
function changeMonth(dir){
  currentMonth.setMonth(currentMonth.getMonth()+dir);
  document.getElementById('monthLabel').textContent=`${currentMonth.getFullYear()}/${String(currentMonth.getMonth()+1).padStart(2,'0')}`;
  autoCarryInstallments();
  render();
  updateSummary();
}

function addExpense(){
  const name=document.getElementById('f-name').value.trim();
  const amt=parseFloat(document.getElementById('f-amount').value)||0;
  const dateStr=toSlash(document.getElementById('f-date').value);
  const card=document.getElementById('f-card').value;
  const person=document.getElementById('f-person').value;
  const note=document.getElementById('f-note').value.trim();
  const fixed=document.getElementById('f-fixed').checked;
  const isInst=document.getElementById('f-inst').checked;

  if(!name||amt<=0||!dateStr){alert('請填寫完整上品項、金額與日期！');return;}

  const item={
    name,amount:amt,date:dateStr,card,person,note,fixed,
    inst:isInst?{cur:parseInt(document.getElementById('f-inst-cur').value)||1,total:parseInt(document.getElementById('f-inst-total').value)||12}:null
  };

  const parts=dateStr.split('/');
  const targetM=new Date(parseInt(parts[0]),parseInt(parts[1])-1,1);
  const list=getExpenses(targetM);
  list.unshift(item);
  saveExpenses(list,targetM);

  closeAddSheet();
  render();
  updateSummary();
}

// 👑 依照你的網頁核心機制，使用「特徵鑰匙」而非隨機ID來尋找比對明細項目
function findExpenseIndex(list, item) {
  if (!item) return -1;
  return list.findIndex(x => x.name === item.name && x.amount === item.amount && x.date === item.date && x.card === item.card && x.person === item.person && (x.note||'') === (item.note||''));
}

function editExpense(idx){
  const list=getExpenses();
  const item=list[idx];
  if(!item)return;
  editingIndex=idx;
  document.getElementById('e-name').value=item.name;
  document.getElementById('e-amount').value=item.amount;
  document.getElementById('e-date').value=toInput(item.date);
  document.getElementById('e-card').value=item.card;
  document.getElementById('e-person').value=item.person;
  document.getElementById('e-note').value=item.note||'';
  document.getElementById('e-fixed').checked=!!item.fixed;
  document.getElementById('e-inst').checked=!!item.inst;
  if(item.inst){
    document.getElementById('e-inst-cur').value=item.inst.cur;
    document.getElementById('e-inst-total').value=item.inst.total;
    document.getElementById('e-inst-fields').style.display='grid';
  }else{
    document.getElementById('e-inst-fields').style.display='none';
  }
  document.getElementById('editModal').style.display='flex';
}
function closeModal(){document.getElementById('editModal').style.display='none';editingIndex=null;}
function closeModalOutside(e){if(e.target.id==='editModal')closeModal();}

function saveEdit(){
  if(editingIndex===null)return;
  const list=getExpenses();
  if(!list[editingIndex])return;

  const name=document.getElementById('e-name').value.trim();
  const amt=parseFloat(document.getElementById('e-amount').value)||0;
  const dateStr=toSlash(document.getElementById('e-date').value);
  const card=document.getElementById('e-card').value;
  const person=document.getElementById('e-person').value;
  const note=document.getElementById('e-note').value.trim();
  const fixed=document.getElementById('e-fixed').checked;
  const isInst=document.getElementById('e-inst').checked;

  if(!name||amt<=0||!dateStr){alert('請完整輸入欄位');return;}

  const updated=Object.assign({},list[editingIndex],{
    name,amount:amt,date:dateStr,card,person,note,fixed,
    inst:isInst?{cur:parseInt(document.getElementById('e-inst-cur').value)||1,total:parseInt(document.getElementById('e-inst-total').value)||12}:null
  });

  const oldParts=list[editingIndex].date.split('/');
  const newParts=dateStr.split('/');
  if(oldParts[0]!==newParts[0]||oldParts[1]!==newParts[1]){
    list.splice(editingIndex,1);saveExpenses(list);
    const targetM=new Date(parseInt(newParts[0]),parseInt(newParts[1])-1,1);
    const otherList=getExpenses(targetM);
    otherList.unshift(updated);saveExpenses(otherList,targetM);
  }else{
    list[editingIndex]=updated;saveExpenses(list);
  }
  closeModal();render();updateSummary();
}

function deleteExpense(idx){deletingIndex=idx;document.getElementById('confirmModal').style.display='flex';}
function cancelDelete(){document.getElementById('confirmModal').style.display='none';deletingIndex=null;}
function confirmDelete(){
  if(deletingIndex===null)return;
  const list=getExpenses();
  if(list[deletingIndex]){list.splice(deletingIndex,1);saveExpenses(list);}
  cancelDelete();render();updateSummary();
}

function autoCarryInstallments(){
  const prevMonth=new Date(currentMonth);prevMonth.setMonth(prevMonth.getMonth()-1);
  const prevList=getExpenses(prevMonth);
  const currentList=getExpenses();
  let changed=false;

  prevList.forEach(pItem=>{
    if(pItem.inst && pItem.inst.cur < pItem.inst.total){
      const nextCur=pItem.inst.cur+1;
      const exist=currentList.some(cItem=>cItem.name===pItem.name && cItem.amount===pItem.amount && cItem.inst && cItem.inst.cur===nextCur);
      if(!exist){
        const nextDate=`${currentMonth.getFullYear()}/${currentMonth.getMonth()+1}/1`;
        currentList.push(Object.assign({},pItem,{
          date:nextDate,
          inst:{cur:nextCur,total:pItem.inst.total}
        }));
        changed=true;
      }
    }
  });
  if(changed){saveExpenses(currentList);updateSummary();}
}

/* ── 👑 核心修復：引導式自訂日期匯入固定支出，完美相容編輯、刪除，絕不漏筆 ── */
function openImportModal() {
  const prevMonth = new Date(currentMonth);
  prevMonth.setMonth(prevMonth.getMonth() - 1);
  const y = prevMonth.getFullYear();
  const m = String(prevMonth.getMonth() + 1).padStart(2, '0');
  document.getElementById('imp-source-month').value = `${y}-${m}`;
  document.getElementById('imp-target-date').value = new Date().toISOString().split('T')[0];
  document.getElementById('imp-preview-text').textContent = `將自動尋找 ${y}/${m} 標記為「固定支出」的項目，並複製到您指定的日期中。`;
  
  document.getElementById('imp-source-month').onchange = function() {
    const parts = this.value.split('-');
    if(parts.length === 2) {
      document.getElementById('imp-preview-text').textContent = `將自動尋找 ${parts[0]}/${parts[1]} 標記為「固定支出」的項目，並複製到您指定的日期中。`;
    }
  };
  document.getElementById('importFixedModal').style.display = 'flex';
}
function closeImportModal() { document.getElementById('importFixedModal').style.display = 'none'; }

function confirmImportFixed() {
  const sourceMonthVal = document.getElementById('imp-source-month').value;
  const targetDateVal = document.getElementById('imp-target-date').value;
  if(!sourceMonthVal || !targetDateVal) { alert('請選擇來源月份與寫入日期！'); return; }

  const sParts = sourceMonthVal.split('-');
  const srcYear = parseInt(sParts[0]);
  const srcMonth = parseInt(sParts[1]);
  const srcKey = `expenses_${srcYear}_${srcMonth}`;
  
  let srcList = [];
  try { const v = localStorage.getItem(srcKey); if(v !== null) srcList = JSON.parse(v); } catch(e) {}
  const fixedItems = srcList.filter(x => x.fixed);

  if(fixedItems.length === 0) { alert(`在 ${srcYear}/${srcMonth} 中找不到任何固定支出項目！`); return; }

  const tParts = targetDateVal.split('-');
  const targetYear = parseInt(tParts[0]);
  const targetMonth = parseInt(tParts[1]);
  const targetDay = parseInt(tParts[2]);
  const targetM = new Date(targetYear, targetMonth - 1, 1);
  const currentList = getExpenses(targetM);
  const formattedTargetDate = `${targetYear}/${targetMonth}/${targetDay}`;

  let count = 0;
  fixedItems.forEach(p => {
    // 💡 拋棄以前死板的名字判定，有幾筆固定就無條件抓幾筆進來，杜絕漏抓
    const newFixedItem = Object.assign({}, p, {
      date: formattedTargetDate // 牢牢寫入你指定的新日期，使其符合目前月份的編輯與刪除定位
    });
    currentList.unshift(newFixedItem);
    count++;
  });

  if(count > 0) {
    saveExpenses(currentList, targetM);
    if(targetM.getFullYear() === currentMonth.getFullYear() && targetM.getMonth() === currentMonth.getMonth()) {
      render();
      if(typeof updateSummary === 'function') updateSummary();
    }
    closeImportModal();
    closeAddSheet();
    alert(`成功從 ${srcYear}/${srcMonth} 完整匯入所有 ${count} 項固定支出至 ${formattedTargetDate}！`);
  } else {
    alert('未成功匯入項目。');
    closeImportModal();
  }
}

function updateSummary(){
  const list=getExpenses();const salary=getSalary();
  let totalSpent=0, cardDue=0, owedUncollected=0;

  list.forEach(item=>{
    if(item.person==='我自己'){
      totalSpent+=item.amount;
      if(item.card!=='現金') cardDue+=item.amount;
    }else{
      owedUncollected+=item.amount;
    }
  });

  const salaryLeft=salary-totalSpent;
  document.getElementById('sumSalary').textContent=`$${salary.toLocaleString()}`;
  document.getElementById('sumLeft').textContent=`$${salaryLeft.toLocaleString()}`;
  document.getElementById('sumLastCard').textContent=`$${cardDue.toLocaleString()}`;
  document.getElementById('sumOwed').textContent=`$${owedUncollected.toLocaleString()}`;
}

function render(){
  const container=document.getElementById('mainContent');if(!container)return;
  const list=getExpenses();

  if(currentTab==='list'){
    if(list.length===0){container.innerHTML='<div class="empty">本月尚無任何記帳明細喔 ☕</div>';return;}
    let html='<div class="expense-list">';
    list.forEach((item, idx)=>{
      html+=`
        <div class="expense-card">
          <div class="card-header ${personHeaderClass(item.person)}">
            <div class="card-header-person">${item.person}</div>
            <div class="card-header-date">${fmtSlash(item.date)}</div>
            <div class="card-header-actions">
              <button class="btn-icon edit" onclick="editExpense(${idx})">✏️</button>
              <button class="btn-icon del" onclick="deleteExpense(${idx})">🗑️</button>
            </div>
          </div>
          <div class="card-body">
            <div class="card-row1">
              <div class="card-name">${item.name}</div>
              <div class="card-amt">$${item.amount.toLocaleString()}</div>
            </div>
            <div class="card-row2">
              <div class="card-tags">
                ${cardPill(item.card)}
                ${item.fixed?'<span class="fixed-badge">固定</span>':''}
                ${item.inst?`<span class="inst-badge">分期 ${item.inst.cur}/${item.inst.total}</span>`:''}
              </div>
              ${item.note?`<div class="card-note">${item.note}</div>`:''}
            </div>
          </div>
        </div>`;
    });
    html+='</div>';
    container.innerHTML=html;
  }
  else if(currentTab==='owed'){
    const pTotals={};getPeople().forEach(p=>{if(p!=='我自己')pTotals[p]={amt:0,count:0};});
    list.forEach(item=>{if(item.person!=='我自己'&&pTotals[item.person]){pTotals[item.person].amt+=item.amount;pTotals[item.person].count++;}});
    let html='<div class="section-header">各成員代墊未收總計</div><div class="owed-grid">';
    Object.keys(pTotals).forEach(p=>{
      html+=`
        <div class="owed-card">
          <div class="owed-name">${p}</div>
          <div class="owed-amt">$${pTotals[p].amt.toLocaleString()}</div>
          <div class="owed-count">${pTotals[p].count} 筆記帳</div>
        </div>`;
    });
    html+='</div>';
    container.innerHTML=html;
  }
  else if(currentTab==='billing'){
    const cSettings=getCardSettings();
    const cTotals={};getCards().forEach(c=>{if(c!=='現金')cTotals[c]=[];});
    list.forEach(item=>{if(item.card!=='現金'&&cTotals[item.card]&&item.person==='我自己')cTotals[item.card].push(item);});

    let html='<div class="billing-list">';
    getCards().forEach(c=>{
      if(c==='現金')return;
      const items=cTotals[c]||[];
      const set=cSettings[c]||{limit:0,billingDay:0};
      const total=items.reduce((s,x)=>s+x.amount,0);
      const pct=set.limit>0?Math.min((total/set.limit)*100,100):0;
      const barClass=pct>85?'danger':pct>60?'warn':'safe';

      html+=`
        <div class="billing-card">
          <div class="billing-card-header">
            <div>
              <div style="font-size:17px;font-weight:900;display:flex;align-items:center;gap:6px;">${c}</div>
              <div class="billing-card-info">結帳日: 每月 ${set.billingDay} 日 / 限額: $${set.limit.toLocaleString()}</div>
            </div>
            <div>
              <div class="billing-total">$${total.toLocaleString()}</div>
              <div class="billing-remaining">剩餘可用: $${(set.limit-total).toLocaleString()}</div>
            </div>
          </div>
          <div class="limit-bar-bg"><div class="limit-bar-fill ${barClass}" style="width:${pct}%"></div></div>
          <div class="limit-meta"><span>額度使用率: ${pct.toFixed(1)}%</span></div>
          <div class="billing-items">
            ${items.length===0?'<div class="billing-no-items">本月此卡無消費明細喔</div>':items.map(item=>`
              <div class="billing-item">
                <div class="bi-left">
                  <div class="bi-row1"><span class="bi-name">${item.name}</span><span class="bi-amt">$${item.amount.toLocaleString()}</span></div>
                  <div class="bi-row2"><span class="bi-date">${fmtSlash(item.date)}</span></div>
                </div>
              </div>`).join('')}
          </div>
        </div>`;
    });
    html+='</div>';
    container.innerHTML=html;
  }
  else if(currentTab==='settings'){
    const cSettings=getCardSettings();
    let html=`
      <div class="settings-wrap">
        <div class="settings-section">
          <div class="settings-title">💰 收入月薪資設定</div>
          <div class="row-input">
            <input type="number" id="s-salary-input" value="${getSalary()}"/>
            <button class="btn btn-primary" onclick="saveSalary(parseFloat(document.getElementById('s-salary-input').value)||0);alert('薪資已儲存！');">儲存</button>
          </div>
        </div>
        <div class="settings-section">
          <div class="settings-title">💳 信用卡結帳日與額度設定</div>
          <table class="card-table">
            <thead><tr><th>卡名</th><th>結帳日</th><th>額度上限</th></tr></thead>
            <tbody>
              ${getCards().filter(c=>c!=='現金').map(c=>`
                <tr>
                  <td><strong>${c}</strong></td>
                  <td><input type="number" value="${cSettings[c]?.billingDay||0}" onchange="updateCardSet('${c}','billingDay',parseInt(this.value)||0)" min="1" max="31"/></td>
                  <td><input type="number" value="${cSettings[c]?.limit||0}" onchange="updateCardSet('${c}','limit',parseFloat(this.value)||0)"/></td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>`;
    container.innerHTML=html;
  }
}

function updateCardSet(card,key,val){
  const s=getCardSettings();if(!s[card])s[card]={};
  s[card][key]=val;saveCardSettings(s);
}
