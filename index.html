<style>
:root{
  --bg:#F5F5EE;--surface:#ffffff;--surface2:#F0EDE4;--border:#E8E4D8;--text:#1A1A1A;--muted:#9A8870;
  --blossom:#EF6F5D;--blossom-light:#FEF3EE;--bubbles:#93D6ED;--bubbles-light:#EEF9FD;
  --buttercup:#A6D785;--buttercup-light:#F0F9E8;--warning:#F9B384;--warning-light:#FEF6EE;
  --deco-pink-light:#FEF0F7;--deco-yellow-light:#FFFDE8;
  --danger:#EF6F5D;--danger-light:#FEF3EE;
  --radius:16px;--radius-lg:24px;
  --shadow:0 2px 12px rgba(45,45,45,.08);--shadow-lg:0 4px 24px rgba(45,45,45,.10),0 1px 4px rgba(45,45,45,.06);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow-x:hidden;overflow-y:auto;color-scheme:light;}
body{background:var(--bg);color:var(--text);font-family:'Inter','Noto Sans TC',sans-serif;font-size:15px;}
.app{display:flex;flex-direction:column;max-width:520px;margin:0 auto;}

/* ── Header ── */
header{padding:28px 22px 16px;display:flex;align-items:center;justify-content:space-between;}
.logo{font-size:22px;font-weight:900;color:var(--text);letter-spacing:-0.5px;display:flex;align-items:center;gap:10px;}
.logo-dot{width:12px;height:12px;border-radius:50%;background:var(--blossom);}
#syncStatus{font-size:11px;color:var(--muted);font-weight:600;margin-left:8px;}
.month-nav{display:flex;align-items:center;gap:10px;}
.month-nav button{background:var(--surface);border:2px solid var(--border);color:var(--muted);width:38px;height:38px;border-radius:50%;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:inherit;transition:all .15s;}
.month-nav button:hover{background:var(--blossom);color:#fff;border-color:var(--blossom);}
.month-label{font-size:16px;color:var(--muted);font-weight:700;min-width:80px;text-align:center;letter-spacing:1px;}

/* ── 大摘要卡片 ── */
.main-card{margin:0 22px 8px;background:var(--surface);border-radius:20px;padding:13px 16px;box-shadow:var(--shadow-lg);position:relative;overflow:hidden;}
.main-card::before{content:"";position:absolute;width:100px;height:100px;border-radius:50%;top:-30px;right:-30px;background:var(--bubbles);opacity:0.08;}
.main-label{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.5px;margin-bottom:3px;}
.main-amount{font-size:18px;font-weight:900;color:var(--text);letter-spacing:1px;line-height:1;margin-bottom:11px;}
.main-row{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--border);padding-top:10px;}
.main-stat{display:flex;flex-direction:column;gap:2px;}
.main-stat:first-child{padding-right:12px;border-right:1px solid var(--border);}
.main-stat:last-child{padding-left:12px;}
.main-stat-val{font-size:14px;font-weight:900;letter-spacing:1px;line-height:1;}
.main-stat-val.green{color:#ced986;}
.main-stat-val.red{color:#e15d5e;}
.main-stat-label{font-size:11px;color:var(--muted);font-weight:700;}

/* ── 代墊未收條 ── */
.owed-bar{margin:0 22px;background:var(--surface);border-radius:14px;padding:10px 16px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-between;}
.owed-bar-label{font-size:12px;color:var(--muted);font-weight:700;}
.owed-bar-val{font-size:14px;font-weight:900;color:#c07020;letter-spacing:1px;}

/* ── 分頁標籤 ── */
.tabs-wrap{padding:8px 22px 0;}
.tabs{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;background:#EDE8D8;border-radius:50px;padding:10px 6px;border:1.5px solid #D8D0C0;}
.tab{font-size:13px;font-weight:700;cursor:pointer;border:none;background:transparent;color:#dbc8a1;white-space:nowrap;text-align:center;width:100%;font-family:inherit;padding:0;line-height:1;transition:color .15s;}
.tab.active{color:#9f754e;}

/* ── Main content ── */
.main{padding:10px 22px 100px;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}

/* ── 篩選列 ── */
.filter-bar{margin-bottom:12px;display:grid;grid-template-columns:1fr 1px 1fr;align-items:center;background:#EDE8D8;border-radius:50px;border:1.5px solid #D8D0C0;overflow:hidden;}
.filter-divider{width:1px;height:16px;background:#D8D0C0;}
.filter-select{background:transparent;border:none;color:#9f754e;padding:10px 0;font-size:13px;font-weight:700;font-family:inherit;outline:none;-webkit-appearance:none;appearance:none;cursor:pointer;width:100%;text-align:center;text-align-last:center;-webkit-text-align-last:center;color-scheme:light;line-height:1;display:block;}

/* ── 新增表單 ── */
.add-form{background:var(--surface);border-radius:var(--radius-lg);padding:22px 20px;margin-bottom:16px;box-shadow:var(--shadow);}
.add-form-title{font-size:15px;font-weight:700;color:var(--muted);margin-bottom:18px;display:flex;align-items:center;justify-content:space-between;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
.gfull{margin-bottom:14px;}
label{font-size:14px;color:var(--muted);display:block;margin-bottom:6px;font-weight:700;letter-spacing:.2px;}
input,select,textarea{width:100%;background:var(--surface2);border:1.5px solid var(--border);color:var(--text);border-radius:12px;padding:12px 14px;font-size:15px;font-family:inherit;outline:none;transition:border-color .15s;-webkit-appearance:none;appearance:none;color-scheme:light;}
input[type="date"],input[type="month"]{background:#fff!important;color-scheme:light!important;}
input:focus,select:focus,textarea:focus{border-color:var(--bubbles);}
textarea{resize:none;height:68px;line-height:1.5;}
