<!DOCTYPE html>
<html lang="zh-TW" style="color-scheme:light;">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<link rel="apple-touch-icon" href="icon.png"/>
<link rel="icon" href="icon.png"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="錢去哪了"/>
<title>錢去哪了</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F5EE;--surface:#ffffff;--surface2:#F0EDE4;--border:#E8E4D8;--text:#1A1A1A;--muted:#9A8870;
  --blossom:#EF6F5D;--blossom-light:#FEF3EE;--bubbles:#93D6ED;--bubbles-light:#EEF9FD;
  --buttercup:#A6D785;--buttercup-light:#F0F9E8;--warning:#F9B384;--warning-light:#FEF6EE;
  --deco-pink-light:#FEF0F7;--deco-yellow-light:#FFFDE8;
  --danger:#EF6F5D;--danger-light:#FEF3EE;
  --radius:16px;--radius-lg:24px;
  --shadow:0 2px 12px rgba(45,45,45,.08);--shadow-lg:0 4px 24px rgba(45,45,45,.10),0 1px 4px rgba(45,45,45,.06);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow-x:hidden;overflow-y:auto;color-scheme:light;}
body{background:var(--bg);color:var(--text);font-family:'Inter','Noto Sans TC',sans-serif;font-size:15px;}
.app{display:flex;flex-direction:column;max-width:520px;margin:0 auto;}

/* ── Header ── */
header{padding:28px 22px 16px;display:flex;align-items:center;justify-content:space-between;}
.logo{font-size:22px;font-weight:900;color:var(--text);letter-spacing:-0.5px;display:flex;align-items:center;gap:10px;}
.logo-dot{width:12px;height:12px;border-radius:50%;background:var(--blossom);}
#syncStatus{font-size:11px;color:var(--muted);font-weight:600;margin-left:8px;}
.month-nav{display:flex;align-items:center;gap:10px;}
.month-nav button{background:var(--surface);border:2px solid var(--border);color:var(--muted);width:38px;height:38px;border-radius:50%;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:inherit;transition:all .15s;}
.month-nav button:hover{background:var(--blossom);color:#fff;border-color:var(--blossom);}
.month-label{font-size:16px;color:var(--muted);font-weight:700;min-width:80px;text-align:center;letter-spacing:1px;}

/* ── 大摘要卡片 ── */
.main-card{margin:0 22px 8px;background:var(--surface);border-radius:22px;padding:16px 18px;box-shadow:var(--shadow-lg);position:relative;overflow:hidden;}
.main-card::before{content:"";position:absolute;width:120px;height:120px;border-radius:50%;top:-40px;right:-40px;background:var(--bubbles);opacity:0.08;}
.main-label{font-size:14px;color:var(--muted);font-weight:700;letter-spacing:.5px;margin-bottom:4px;}
.main-amount{font-size:22px;font-weight:900;color:var(--text);letter-spacing:1px;line-height:1;margin-bottom:14px;}
.main-row{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--border);padding-top:12px;}
.main-stat{display:flex;flex-direction:column;gap:3px;}
.main-stat:first-child{padding-right:14px;border-right:1px solid var(--border);}
.main-stat:last-child{padding-left:14px;}
.main-stat-val{font-size:16px;font-weight:900;letter-spacing:1px;line-height:1;}
.main-stat-val.green{color:#ced986;}
.main-stat-val.red{color:#e15d5e;}
.main-stat-label{font-size:13px;color:var(--muted);font-weight:700;}

/* ── 代墊未收條 ── */
.owed-bar{margin:0 22px;background:var(--surface);border-radius:16px;padding:12px 18px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-between;}
.owed-bar-label{font-size:14px;color:var(--muted);font-weight:700;}
.owed-bar-val{font-size:16px;font-weight:900;color:#c07020;letter-spacing:1px;}

/* ── 分頁標籤 ── */
.tabs-wrap{padding:10px 22px 0;}
.tabs{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;background:#EDE8D8;border-radius:50px;padding:12px 8px;border:1.5px solid #D8D0C0;}
.tab{font-size:15px;font-weight:700;cursor:pointer;border:none;background:transparent;color:#dbc8a1;white-space:nowrap;text-align:center;width:100%;font-family:inherit;padding:0;line-height:1;transition:color .15s;}
.tab.active{color:#9f754e;}

/* ── Main content ── */
.main{padding:12px 22px 100px;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}

/* ── 篩選列 ── */
.filter-bar{margin-bottom:14px;display:grid;grid-template-columns:1fr 1px 1fr;align-items:center;background:#EDE8D8;border-radius:50px;border:1.5px solid #D8D0C0;overflow:hidden;}
.filter-divider{width:1px;height:20px;background:#D8D0C0;}
.filter-select{background:transparent;border:none;color:#9f754e;padding:11px 14px;font-size:15px;font-weight:700;font-family:inherit;outline:none;-webkit-appearance:none;appearance:none;cursor:pointer;width:100%;text-align:center;color-scheme:light;}

/* ── 新增表單 ── */
.add-form{background:var(--surface);border-radius:var(--radius-lg);padding:22px 20px;margin-bottom:16px;box-shadow:var(--shadow);}
.add-form-title{font-size:15px;font-weight:700;color:var(--muted);margin-bottom:18px;display:flex;align-items:center;justify-content:space-between;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
.gfull{margin-bottom:14px;}
label{font-size:14px;color:var(--muted);display:block;margin-bottom:6px;font-weight:700;letter-spacing:.2px;}
input,select,textarea{width:100%;background:var(--surface2);border:1.5px solid var(--border);color:var(--text);border-radius:12px;padding:12px 14px;font-size:15px;font-family:inherit;outline:none;transition:border-color .15s;-webkit-appearance:none;appearance:none;color-scheme:light;}
input[type="date"],input[type="month"]{background:#fff!important;color-scheme:light!important;}
input:focus,select:focus,textarea:focus{border-color:var(--bubbles);}
textarea{resize:none;height:68px;line-height:1.5;}
.btn{border:none;border-radius:12px;padding:11px 18px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;transition:all .15s;}
.btn-primary{background:var(--text);color:#fff;}
.btn-primary:hover{background:#333;}
.btn-secondary{background:var(--surface2);border:1.5px solid var(--border);color:var(--muted);}
.btn-secondary:hover{border-color:var(--text);color:var(--text);}
.btn-danger-soft{background:var(--danger-light);border:1.5px solid #f5c0b0;color:var(--danger);}
.checkbox-label{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);cursor:pointer;white-space:nowrap;font-weight:700;}
.checkbox-label input[type=checkbox]{width:16px;height:16px;accent-color:var(--blossom);-webkit-appearance:auto;appearance:auto;}

/* ── 明細卡片 ── */
.expense-list{display:flex;flex-direction:column;gap:12px;}
.expense-card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}
.card-header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:10px 14px;}
.card-header-person{font-size:15px;font-weight:700;justify-self:start;}
.card-header-date{font-size:13px;font-weight:700;color:var(--text);text-align:center;}
.card-header-actions{display:flex;gap:6px;justify-self:end;}
.btn-icon{background:transparent;border:none;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;font-weight:700;width:26px;height:26px;border-radius:50%;}
.btn-icon.edit{background:#F0EDE4;color:#9A8870;}
.btn-icon.del{background:var(--blossom-light);color:var(--blossom);}
.card-body{padding:12px 16px 14px;}
.card-row1{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px;}
.card-name{font-size:19px;font-weight:900;color:var(--text);flex:1;line-height:1.2;}
.card-amt{font-size:19px;font-weight:900;color:var(--blossom);white-space:nowrap;margin-left:12px;}
.card-row2{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.card-tags{display:flex;flex-wrap:wrap;gap:6px;flex:1;}
.card-note{font-size:12px;color:var(--muted);white-space:nowrap;text-align:right;flex-shrink:0;font-style:italic;}

/* header colours per person index */
.h0{background:#ede8f5;}.h0 .card-header-person{color:#9070b8;}
.h1{background:#fef5e4;}.h1 .card-header-person{color:#c8881a;}
.h2{background:#e8f5f0;}.h2 .card-header-person{color:#3a9a7a;}
.h3{background:#fde8ee;}.h3 .card-header-person{color:#c84060;}
.h4{background:#e8f2f8;}.h4 .card-header-person{color:#4878a8;}
.h5{background:#FEF6EE;}.h5 .card-header-person{color:#c87030;}
.h6{background:#F0EEF8;}.h6 .card-header-person{color:#7060b0;}
.h7{background:#EEF8F4;}.h7 .card-header-person{color:#308870;}
.h8{background:#EEF4F8;}.h8 .card-header-person{color:#3060a0;}
.h9{background:#F8EEF0;}.h9 .card-header-person{color:#b04060;}

/* pills & badges */
.pill{display:inline-block;font-size:12px;padding:3px 10px;border-radius:50px;font-weight:700;white-space:nowrap;}
[data-pi="0"]{background:#ede8f5;color:#9070b8;border:1.5px solid #d0b8de;}
[data-pi="1"]{background:#fef5e4;color:#c8881a;border:1.5px solid #f3bc72;}
[data-pi="2"]{background:#e8f5f0;color:#3a9a7a;border:1.5px solid #96d4bf;}
[data-pi="3"]{background:#fde8ee;color:#c84060;border:1.5px solid #f6a5b4;}
[data-pi="4"]{background:#e8f2f8;color:#4878a8;border:1.5px solid #79a5c8;}
[data-pi="5"]{background:var(--warning-light);color:#c87030;border:1.5px solid #F9B384;}
[data-pi="6"]{background:#F0EEF8;color:#7060b0;border:1.5px solid #C8C0E0;}
[data-pi="7"]{background:#EEF8F4;color:#308870;border:1.5px solid #88D0B8;}
[data-pi="8"]{background:#EEF4F8;color:#3060a0;border:1.5px solid #88B0D8;}
[data-pi="9"]{background:#F8EEF0;color:#b04060;border:1.5px solid #E0A8B0;}
.fixed-badge{font-size:11px;background:var(--buttercup-light);color:#5a9a30;border-radius:50px;padding:3px 9px;font-weight:700;border:1.5px solid #A6D785;display:inline-block;}
.inst-badge{font-size:11px;color:#7060b0;background:#F0EEF8;border-radius:50px;padding:3px 9px;font-weight:700;border:1.5px solid #C8C0E0;display:inline-block;}
.btn-sm{background:var(--surface2);border:1.5px solid var(--border);color:var(--muted);cursor:pointer;font-size:12px;padding:4px 12px;border-radius:50px;font-family:inherit;font-weight:700;white-space:nowrap;}
.btn-sm.done{border-color:#A6D785;color:#5a9a30;background:var(--buttercup-light);}

/* ── 代收帳 ── */
.section-header{font-size:13px;color:var(--muted);margin-bottom:12px;display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.5px;}
.section-header::after{content:'';flex:1;height:1px;background:var(--border);}
.owed-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px;}
.owed-card{background:var(--surface);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);}
/* 代收總額卡：新排版 */
.owed-card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 10px 14px 12px;
  box-shadow: var(--shadow);
  margin-bottom: 10px;
}

/* 上面：人員色塊 + 人名（用 pill 顏色） */
.owed-card-header {
  display: flex;
  align-items: center;
  margin-bottom: 6px;
}

/* 下面：金額（左） + 筆數（右） */
.owed-card-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

/* 金額：大字，靠左 */
.owed-total-amt {
  font-size: 20px;
  font-weight: 900;
  color: #c87030; /* 和你原本 owed-amt 顏色一樣 */
}

/* 筆數：右側，大數字 + 小「筆」字 */
.owed-count-wrap {
  display: flex;
  align-items: baseline;
  gap: 2px;
}

.owed-count-num {
  font-size: 20px;
  font-weight: 900;
  color: #c87030;
}

.owed-count-label {
  font-size: 11px;
  font-weight: 700;
  color: var(--muted);
}
.owed-name{font-size:13px;color:var(--muted);margin-bottom:8px;font-weight:700;}
.owed-amt{font-size:20px;color:#c87030;font-weight:900;letter-spacing:1px;}
.owed-count{font-size:13px;color:var(--muted);margin-top:4px;font-weight:600;}

/* ── 帳單對帳 ── */
.billing-list{display:flex;flex-direction:column;gap:16px;}
.billing-card{background:var(--surface);border-radius:var(--radius-lg);padding:20px 20px;box-shadow:var(--shadow);}
.billing-card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;}
.billing-card-info{font-size:13px;color:var(--muted);margin-top:4px;font-weight:600;}
.billing-total{font-size:22px;font-weight:900;color:var(--blossom);text-align:right;}
.billing-remaining{font-size:12px;color:var(--muted);text-align:right;margin-top:2px;font-weight:600;}
.limit-bar-bg{background:var(--surface2);border-radius:6px;height:7px;overflow:hidden;margin:10px 0 5px;border:1px solid var(--border);}
.limit-bar-fill{height:7px;border-radius:6px;}
.limit-bar-fill.safe{background:var(--buttercup);}
.limit-bar-fill.warn{background:var(--warning);}
.limit-bar-fill.danger{background:var(--blossom);}
.limit-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:14px;font-weight:600;}
.billing-date-block{margin-bottom:14px;}
.billing-date-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:10px;}
.billing-date-grid label{font-size:13px;color:var(--muted);font-weight:700;display:block;margin-bottom:5px;}
.btn-apply-full{width:100%;background:var(--surface2);border:1.5px solid var(--border);color:var(--muted);border-radius:12px;padding:11px;font-size:14px;cursor:pointer;font-family:inherit;font-weight:700;text-align:center;}
.btn-apply-full:hover{border-color:var(--text);color:var(--text);}
.billing-items{border-top:1px solid var(--border);padding-top:4px;}
.billing-stat-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);padding:8px 4px 10px;font-weight:600;}
.billing-checked-total{font-size:13px;color:#5a9a30;font-weight:700;}
.billing-item{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--border);}
.billing-item:last-child{border-bottom:none;}
.billing-item.checked{opacity:.45;}
.billing-item.checked .bi-name{text-decoration:line-through;color:var(--muted);}
.check-btn{flex-shrink:0;width:28px;height:28px;border-radius:50%;border:2px solid var(--border);background:var(--surface2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;color:transparent;transition:all .15s;}
.billing-item.checked .check-btn{background:var(--buttercup);border-color:var(--buttercup);color:#fff;}
.bi-left{flex:1;min-width:0;}
.bi-row1{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:5px;}
.bi-name{font-size:16px;font-weight:700;color:var(--text);}
.bi-amt{font-size:16px;font-weight:900;color:var(--blossom);white-space:nowrap;margin-left:10px;}
.bi-row2{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:space-between;}
.bi-tags{display:flex;gap:6px;flex-wrap:wrap;}
.bi-date{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap;}
.billing-no-items{font-size:13px;color:var(--muted);text-align:center;padding:20px 0;}

/* ── 設定頁 ── */
.settings-wrap{display:flex;flex-direction:column;gap:24px;}
.settings-section{display:flex;flex-direction:column;gap:12px;}
.settings-title{font-size:15px;font-weight:700;color:var(--muted);padding-bottom:10px;border-bottom:1.5px solid var(--border);}
.row-input{display:flex;gap:10px;align-items:center;}
.row-input input{flex:1;min-width:0;}
.salary-detail{background:var(--surface2);border-radius:14px;padding:14px 16px;}
.salary-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);}
.salary-row:last-child{border-bottom:none;padding-top:10px;}
.salary-row-label{font-size:14px;color:var(--muted);font-weight:600;}
.salary-row:last-child .salary-row-label{font-size:15px;font-weight:900;color:var(--text);}
.salary-val{font-size:15px;font-weight:900;}
.salary-val.red{color:var(--blossom);}
.salary-val.green{color:#4a8a20;}
.salary-row:last-child .salary-val{font-size:16px;}
.tag-list{display:flex;flex-wrap:wrap;gap:8px;}
.tag-item{display:inline-flex;align-items:center;gap:5px;border-radius:50px;padding:5px 11px;font-size:14px;font-weight:700;border:1.5px solid;}
.tag-item button{background:transparent;border:none;cursor:pointer;font-size:13px;color:inherit;opacity:.55;padding:0;font-family:inherit;}
.tag-add-row{display:flex;gap:10px;align-items:center;}
.tag-add-row input{flex:1;min-width:0;}
.card-table{width:100%;border-collapse:collapse;background:var(--surface);border-radius:14px;overflow:hidden;border:1.5px solid var(--border);}
.card-table th{font-size:13px;color:var(--muted);font-weight:700;padding:9px 12px;text-align:center;background:var(--surface2);}
.card-table td{padding:9px 10px;border-top:1px solid var(--border);vertical-align:middle;text-align:center;}
.card-table td:first-child{width:80px;}
.card-table td:last-child{width:70px;}
.card-table input{background:var(--surface2);border:1.5px solid var(--border);color:var(--text);border-radius:8px;padding:7px 10px;font-size:14px;font-family:inherit;outline:none;width:100%;text-align:center;}

/* ── Modal ── */
.modal-overlay{position:fixed;inset:0;background:rgba(45,45,45,.25);backdrop-filter:blur(8px);display:flex;align-items:flex-end;justify-content:center;z-index:100;}
.modal{background:var(--surface);border-radius:24px 24px 0 0;padding:20px 20px 40px;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;box-shadow:0 -6px 28px rgba(45,45,45,.1);}
.modal-handle{width:36px;height:4px;background:var(--border);border-radius:3px;margin:0 auto 18px;}
.modal-title{font-size:16px;font-weight:700;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;}
.modal-actions{display:flex;gap:8px;margin-top:16px;}
.modal-actions .btn{flex:1;padding:13px;}
.mg2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
.mgfull{margin-bottom:12px;}

/* ── Empty ── */
.empty{text-align:center;padding:48px 24px;color:var(--muted);font-size:14px;}

@media(max-width:640px){
  html,body{height:100%;overflow:hidden;}
  .app{width:100%;height:100vh;display:flex;flex-direction:column;position:fixed;top:0;left:0;right:0;bottom:0;}
  .main{overflow-y:scroll;-webkit-overflow-scrolling:touch;flex:1;min-height:0;}
}
/* ── 浮動新增按鈕 ── */
.fab{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);width:calc(100% - 44px);max-width:476px;background:var(--text);color:#fff;border:none;border-radius:50px;padding:16px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 6px 24px rgba(26,26,26,.28);z-index:50;display:flex;align-items:center;justify-content:center;gap:8px;}
.overlay{position:fixed;inset:0;background:rgba(45,45,45,.2);backdrop-filter:blur(4px);z-index:55;display:none;}
.overlay.open{display:block;}
.form-sheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:var(--surface);border-radius:24px 24px 0 0;padding:18px 20px 44px;box-shadow:0 -6px 28px rgba(45,45,45,.15);z-index:60;display:none;max-height:92vh;overflow-y:auto;}
.form-sheet.open{display:block;}
.sheet-handle{width:36px;height:4px;background:var(--border);border-radius:3px;margin:0 auto 16px;}
.sheet-title{font-size:15px;font-weight:700;color:var(--muted);margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;}
.btn-sheet-close{background:var(--surface2);border:1.5px solid var(--border);color:var(--muted);border-radius:50%;width:30px;height:30px;font-size:16px;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.sheet-g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
.sheet-gfull{margin-bottom:12px;}
.sheet-bottom{display:flex;align-items:center;gap:14px;flex-wrap:nowrap;margin-top:4px;}
.sheet-cbx{display:flex;align-items:center;gap:5px;font-size:14px;color:var(--muted);font-weight:700;white-space:nowrap;cursor:pointer;}
.sheet-cbx input[type=checkbox]{width:16px;height:16px;accent-color:var(--blossom);-webkit-appearance:auto;appearance:auto;flex-shrink:0;}
</style>
<script>
function loadScript(src){return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=reject;document.head.appendChild(s);});}
window._firebaseLoader=loadScript('https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js').then(()=>loadScript('https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js')).catch(e=>console.warn('Firebase CDN load failed:',e));
</script>
</head>
<body>
<div class="app">
  <header>
    <div style="display:flex;align-items:center;">
      <div class="logo"><span class="logo-dot"></span>錢去哪了</div>
      <span id="syncStatus"></span>
    </div>
    <div class="month-nav">
      <button onclick="changeMonth(-1)">‹</button>
      <span class="month-label" id="monthLabel"></span>
      <button onclick="changeMonth(1)">›</button>
    </div>
  </header>

  <!-- 大摘要卡 -->
  <div class="main-card">
    <div class="main-label">本月薪資</div>
    <div class="main-amount" id="sumSalary">—</div>
    <div class="main-row">
      <div class="main-stat">
        <div class="main-stat-val green" id="sumLeft">—</div>
        <div class="main-stat-label">薪資剩餘</div>
      </div>
      <div class="main-stat">
        <div class="main-stat-val red" id="sumLastCard">—</div>
        <div class="main-stat-label">本月應繳</div>
      </div>
    </div>
  </div>

  <!-- 代墊未收條 -->
  <div class="owed-bar">
    <div class="owed-bar-label">代墊未收</div>
    <div class="owed-bar-val" id="sumOwed">—</div>
  </div>

  <!-- 分頁標籤 -->
  <div class="tabs-wrap">
    <div class="tabs">
      <button class="tab active" onclick="switchTab('list')">明細表</button>
      <button class="tab" onclick="switchTab('owed')">代收帳</button>
      <button class="tab" onclick="switchTab('billing')">對帳單</button>
      <button class="tab" onclick="switchTab('settings')">設定區</button>
    </div>
  </div>

  <div class="main" id="mainContent"></div>
</div>

<!-- 浮動新增按鈕 -->
<button class="fab" id="fabBtn" onclick="openAddSheet()">＋ 新增記帳</button>

<!-- 遮罩 -->
<div class="overlay" id="overlay" onclick="closeAddSheet()"></div>

<!-- 新增表單 Sheet -->
<div class="form-sheet" id="addSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-title">
    <span>新增記帳</span>
    <div style="display:flex;gap:8px;align-items:center;">
      <button class="btn btn-secondary" style="font-size:12px;padding:6px 12px;" onclick="importFixed()">↓ 匯入上月固定</button>
      <button class="btn-sheet-close" onclick="closeAddSheet()">✕</button>
    </div>
  </div>
  <div class="sheet-g2">
    <div><label>品項</label><input id="f-name" placeholder="例：晚餐"/></div>
    <div><label>金額</label><input id="f-amount" type="number" placeholder="0"/></div>
  </div>
  <div class="sheet-gfull"><label>消費日期</label><input id="f-date" type="date" value="" style="background:#fff;color-scheme:light;"/></div>
  <div class="sheet-g2">
    <div><label>付款方式</label><select id="f-card"></select></div>
    <div><label>誰的帳</label><select id="f-person"></select></div>
  </div>
  <div class="sheet-gfull"><label>備註（選填）</label><textarea id="f-note" placeholder="例：實際刷卡日4/30，5/2才入帳"></textarea></div>
  <div class="sheet-bottom">
    <label class="sheet-cbx"><input type="checkbox" id="f-fixed"> 固定支出</label>
    <label class="sheet-cbx"><input type="checkbox" id="f-inst" onchange="toggleAddInst()"> 分期</label>
    <div id="f-inst-fields" style="display:none;">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
        <div><label>第幾期</label><input id="f-inst-cur" type="number" placeholder="1" min="1"/></div>
        <div><label>共幾期</label><input id="f-inst-total" type="number" placeholder="12" min="1"/></div>
      </div>
    </div>
    <button class="btn btn-primary" style="margin-left:auto;flex-shrink:0;" onclick="addExpense()">新增</button>
  </div>
</div>

<!-- Edit Modal -->
<div class="modal-overlay" id="editModal" style="display:none;" onclick="closeModalOutside(event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">編輯記帳 <button class="btn-icon del" onclick="closeModal()">✕</button></div>
    <div class="mg2">
      <div><label>品項</label><input id="e-name"/></div>
      <div><label>金額</label><input id="e-amount" type="number"/></div>
    </div>
    <div class="mgfull"><label>消費日期</label><input id="e-date" type="date" style="background:#fff;color-scheme:light;"/></div>
    <div class="mg2">
      <div><label>付款方式</label><select id="e-card"></select></div>
      <div><label>誰的帳</label><select id="e-person"></select></div>
    </div>
    <div class="mgfull"><label>備註（選填）</label><textarea id="e-note" placeholder="例：實際刷卡日4/30，5/2才入帳"></textarea></div>
    <div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:10px;">
      <label class="checkbox-label"><input type="checkbox" id="e-fixed"> 固定支出</label>
      <label class="checkbox-label"><input type="checkbox" id="e-inst" onchange="toggleEditInst()"> 分期</label>
    </div>
    <div id="e-inst-fields" style="display:none;" class="mg2">
      <div><label>第幾期</label><input id="e-inst-cur" type="number" min="1"/></div>
      <div><label>共幾期</label><input id="e-inst-total" type="number" min="1"/></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="saveEdit()">儲存</button>
    </div>
  </div>
</div>

<!-- Confirm Delete -->
<div class="modal-overlay" id="confirmModal" style="display:none;">
  <div class="modal" style="max-width:340px;border-radius:24px;padding:24px 20px 24px;">
    <div class="modal-handle"></div>
    <div style="text-align:center;margin-bottom:20px;">
      <div style="font-size:28px;margin-bottom:10px;">🗑️</div>
      <div style="font-size:16px;font-weight:700;margin-bottom:6px;" id="confirmMsg">確定刪除？</div>
      <div style="font-size:13px;color:var(--muted);">刪除後無法復原</div>
    </div>
    <div style="display:flex;gap:8px;">
      <button class="btn btn-secondary" style="flex:1;" onclick="cancelDelete()">取消</button>
      <button class="btn btn-danger-soft" style="flex:1;" onclick="confirmDelete()">確定刪除</button>
    </div>
  </div>
</div>

<!-- Payment Modal -->
<div class="modal-overlay" id="paymentModal" style="display:none;" onclick="closePaymentModalOutside(event)">
  <div class="modal" style="max-width:480px;">
    <div class="modal-handle"></div>
    <div class="modal-title">記錄卡費繳清 <button class="btn-icon del" onclick="closePaymentModal()">✕</button></div>
    <div class="mgfull"><label>選擇信用卡</label><select id="pm-card"></select></div>
    <div class="mg2">
      <div><label>帳單月份</label><input type="month" id="pm-month" style="background:#fff;color-scheme:light;"/></div>
      <div><label>實際繳款金額</label><input type="number" id="pm-amount" placeholder="0"/></div>
    </div>
    <div class="mgfull"><label>繳款日期</label><input type="date" id="pm-date" style="background:#fff;color-scheme:light;"/></div>
    <div class="mgfull"><label>備註（選填）</label><input id="pm-note" placeholder="例：網路銀行轉帳"/></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closePaymentModal()">取消</button>
      <button class="btn btn-primary" onclick="savePayment()">記錄繳款</button>
    </div>
  </div>
</div>

<script>
const S={get(k,def){try{const v=localStorage.getItem(k);return v!==null?JSON.parse(v):def;}catch{return def;}},set(k,v){localStorage.setItem(k,JSON.stringify(v));if(window.FB)window.FB.set(k,JSON.stringify(v));},del(k){localStorage.removeItem(k);if(window.FB)window.FB.del(k);}};
function showSyncStatus(msg,ok=false,warn=false){const el=document.getElementById('syncStatus');if(!el)return;el.textContent=msg;el.style.color=warn?'var(--warning)':ok?'var(--buttercup)':'var(--muted)';if(ok)setTimeout(()=>{if(el)el.textContent='';},3000);}

let currentTab='list',currentMonth=new Date(),billingRanges=S.get('billing_ranges',{}),editingId=null;
currentMonth.setDate(1);

const DEFAULT_PEOPLE=['我自己','懶人爸','阿肥媽','豬頭弟','小八貓'];
const DEFAULT_CARDS=['台新','現金','玉山','國泰','富邦','聯邦','華南','中信'];
const CARD_DEFAULTS={'玉山':{limit:70000,billingDay:27},'台新':{limit:30000,billingDay:2},'國泰':{limit:60000,billingDay:10},'中信':{limit:60000,billingDay:5},'聯邦':{limit:60000,billingDay:12},'富邦':{limit:100000,billingDay:8},'華南':{limit:60000,billingDay:23},'現金':{limit:0,billingDay:0}};

function getPeople(){return S.get('people',DEFAULT_PEOPLE);}
function getCards(){return S.get('cards',DEFAULT_CARDS);}
function savePeople(p){S.set('people',p);}
function saveCards(c){S.set('cards',c);}

function personPill(p){const i=Math.abs(getPeople().indexOf(p))%10;return`<span class="pill" data-pi="${i}">${p}</span>`;}
function cardPill(c){const i=(Math.abs(getCards().indexOf(c))+3)%10;return`<span class="pill" data-pi="${i}">${c}</span>`;}
function personHeaderClass(p){const i=Math.abs(getPeople().indexOf(p))%10;return`h${i}`;}

function monthKey(d){return`expenses_${d.getFullYear()}_${d.getMonth()+1}`;}
function getExpenses(d){return S.get(monthKey(d||currentMonth),[]);}
function saveExpenses(data,d){S.set(monthKey(d||currentMonth),data);}
function saveExpenseByDate(expense){const parts=expense.date.split('/');const d=new Date(parseInt(parts[0]),parseInt(parts[1])-1,1);const ex=getExpenses(d);const idx=ex.findIndex(x=>x.id===expense.id);if(idx>=0){ex[idx]=expense;}else{ex.unshift(expense);}saveExpenses(ex,d);}

function getSalary(){return S.get('salary',36884);}
function saveSalary(v){S.set('salary',v);}
function getCardSettings(){const saved=S.get('card_settings',{});const m={};getCards().forEach(c=>{m[c]=Object.assign({},CARD_DEFAULTS[c]||{limit:0,billingDay:0},saved[c]||{});});return m;}
function saveCardSettings(d){S.set('card_settings',d);}
function toSlash(s){return s?s.replace(/-/g,'/'):'';} 
function toInput(s){return s?s.replace(/\//g,'-'):'';} 
function fmtSlash(d){return`${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;}
function todayInput(){const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function fmt(n){return'NT$'+Math.round(n).toLocaleString();}

function getExpensesInRange(from,to){
  if(!from||!to)return[];
  const fromDate=new Date(from.replace(/\//g,'-')),toDate=new Date(to.replace(/\//g,'-'));
  if(isNaN(fromDate)||isNaN(toDate))return[];
  const results=[],cur=new Date(fromDate.getFullYear(),fromDate.getMonth(),1);
  const endMonth=new Date(toDate.getFullYear(),toDate.getMonth(),1);
  while(cur<=endMonth){getExpenses(new Date(cur)).forEach(e=>{if(e.date&&e.date>=from&&e.date<=to)results.push(e);});cur.setMonth(cur.getMonth()+1);}
  return results;
}

function getFutureCommitted(card){const checks=getBillingChecks(card);const seen=new Set();let committed=0;for(let i=-36;i<=36;i++){const d=new Date(currentMonth.getFullYear(),currentMonth.getMonth()+i,1);getExpenses(d).filter(e=>e.card===card&&!checks[e.id]).forEach(e=>{if(!seen.has(e.id)){seen.add(e.id);committed+=e.amount;}});}return committed;}
function getBillingChecks(card){return S.get(`billing_checks_${card}`,{});}
function saveBillingChecks(card,data){S.set(`billing_checks_${card}`,data);}
function toggleBillingCheck(card,expenseId){const checks=getBillingChecks(card);checks[expenseId]=!checks[expenseId];saveBillingChecks(card,checks);document.getElementById('mainContent').innerHTML=renderBilling();}

function calcMonthlyPayable(){
  let cardTotal=0;
  getCards().filter(c=>c!=='現金').forEach(card=>{const range=billingRanges[card];if(!range||!range.from||!range.to)return;const items=getExpensesInRange(range.from,range.to).filter(e=>e.card===card&&e.person==='我自己');cardTotal+=items.reduce((s,e)=>s+e.amount,0);});
  const cashTotal=getExpenses().filter(e=>e.card==='現金'&&e.person==='我自己').reduce((s,e)=>s+e.amount,0);
  return{cardTotal,cashTotal};
}

function updateSummary(){
  const salary=getSalary();
  const {cardTotal,cashTotal}=calcMonthlyPayable();
  const totalPayable=cardTotal+cashTotal;
  const seen=new Set();let owed=0;
  getExpenses().filter(e=>e.person!=='我自己'&&!e.paid&&e.card==='現金').forEach(e=>{if(!seen.has(e.id)){seen.add(e.id);owed+=e.amount;}});
  getCards().filter(c=>c!=='現金').forEach(card=>{const range=billingRanges[card];if(!range||!range.from||!range.to)return;getExpensesInRange(range.from,range.to).filter(e=>e.card===card&&e.person!=='我自己'&&!e.paid).forEach(e=>{if(!seen.has(e.id)){seen.add(e.id);owed+=e.amount;}});});
  const left=salary-totalPayable;
  document.getElementById('sumSalary').textContent=fmt(salary);
  document.getElementById('sumLastCard').textContent=fmt(totalPayable);
  document.getElementById('sumOwed').textContent=fmt(owed);
  document.getElementById('sumLeft').textContent=fmt(left);
  document.getElementById('sumLeft').className='main-stat-val '+(left<0?'red':'green');
}

function changeMonth(dir){
  currentMonth.setMonth(currentMonth.getMonth()+dir);
  document.getElementById('monthLabel').textContent=`${currentMonth.getFullYear()}/${String(currentMonth.getMonth()+1).padStart(2,'0')}`;
  if(Object.keys(billingRanges).length>0){getCards().filter(c=>c!=='現金').forEach(card=>{const r=billingRanges[card];if(!r||!r.from||!r.to)return;const fromDate=new Date(r.from.replace(/\//g,'-'));const toDate=new Date(r.to.replace(/\//g,'-'));fromDate.setMonth(fromDate.getMonth()+dir);toDate.setMonth(toDate.getMonth()+dir);billingRanges[card]={from:fmtSlash(fromDate),to:fmtSlash(toDate)};});S.set('billing_ranges',billingRanges);}
  autoCarryInstallments();render();
}

function autoCarryInstallments(){
  const ex=getExpenses();
  const lastMonth=new Date(currentMonth.getFullYear(),currentMonth.getMonth()-1,1);
  const lastEx=getExpenses(lastMonth);
  const pendingInst=lastEx.filter(e=>e.installment&&e.instCur&&e.instTotal&&e.instCur<e.instTotal);
  if(!pendingInst.length)return;
  const existingSources=new Set(ex.filter(e=>e.sourceId).map(e=>e.sourceId));
  const existingOrigins=new Set(ex.filter(e=>e.originId).map(e=>e.originId));
  let added=0;
  pendingInst.forEach(e=>{const origin=e.originId||e.id;if(existingSources.has(e.id)||existingOrigins.has(origin))return;const nextCur=e.instCur+1;const origDay=parseInt((e.date||'').split('/')[2]||'1');const y=currentMonth.getFullYear(),m=currentMonth.getMonth();const day=Math.min(origDay,new Date(y,m+1,0).getDate());const date=`${y}/${String(m+1).padStart(2,'0')}/${String(day).padStart(2,'0')}`;ex.push({...e,id:Date.now()+Math.random(),sourceId:e.id,originId:origin,date,paid:false,instCur:nextCur});added++;});
  if(added>0)saveExpenses(ex);
}

function switchTab(tab){
  currentTab=tab;
  const tabs=['list','owed','billing','settings'];
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',tabs[i]===tab));
  const fab=document.getElementById('fabBtn');
  if(fab)fab.style.display=(tab==='list')?'flex':'none';
  render();
}

function openAddSheet(){
  const people=getPeople(),cards=getCards();
  document.getElementById('f-card').innerHTML=cards.map(c=>`<option>${c}</option>`).join('');
  document.getElementById('f-person').innerHTML=people.map(p=>`<option>${p}</option>`).join('');
  document.getElementById('f-date').value=todayInput();
  document.getElementById('addSheet').classList.add('open');
  document.getElementById('overlay').classList.add('open');
}
function closeAddSheet(){
  document.getElementById('addSheet').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
}
function addExpense(){
  const name=document.getElementById('f-name').value.trim();
  const amount=parseInt(document.getElementById('f-amount').value);
  const card=document.getElementById('f-card').value;
  const person=document.getElementById('f-person').value;
  const date=toSlash(document.getElementById('f-date').value);
  const note=document.getElementById('f-note').value.trim();
  const fixed=document.getElementById('f-fixed').checked;
  const isInst=document.getElementById('f-inst').checked;
  const instCur=isInst?parseInt(document.getElementById('f-inst-cur').value||1):null;
  const instTotal=isInst?parseInt(document.getElementById('f-inst-total').value||1):null;
  if(!name||!amount||!card||!person||!date)return;
  const expense={id:Date.now(),name,amount,card,person,date,note,fixed,installment:isInst,instCur,instTotal,paid:false};
  saveExpenseByDate(expense);
  document.getElementById('f-name').value='';document.getElementById('f-amount').value='';document.getElementById('f-note').value='';
  document.getElementById('f-fixed').checked=false;document.getElementById('f-inst').checked=false;
  document.getElementById('f-inst-fields').style.display='none';
  closeAddSheet();
  render();
}
function toggleAddInst(){document.getElementById('f-inst-fields').style.display=document.getElementById('f-inst').checked?'grid':'none';}

function importFixed(){
  const lastMonth=new Date(currentMonth.getFullYear(),currentMonth.getMonth()-1,1);
  const lastEx=getExpenses(lastMonth);
  const toCarry=lastEx.filter(e=>e.fixed||(e.installment&&e.instCur&&e.instTotal&&e.instCur<e.instTotal));
  if(!toCarry.length){alert('上個月沒有固定支出或未完成分期可以匯入');return;}
  const ex=getExpenses();const today=toSlash(todayInput());
  const existingSources=new Set(ex.filter(e=>e.sourceId).map(e=>e.sourceId));
  let imported=0;
  toCarry.forEach(e=>{if(existingSources.has(e.id))return;const nextCur=e.installment&&e.instCur?e.instCur+1:e.instCur;const newExp={...e,id:Date.now()+Math.random(),sourceId:e.id,date:today,paid:false,instCur:nextCur};saveExpenseByDate(newExp);imported++;});
  render();alert(imported>0?`已匯入 ${imported} 筆`:'本月已匯入過，不重複新增');closeAddSheet();
}

let pendingDeleteId=null;
function deleteExpense(id){pendingDeleteId=id;const e=findExpenseAnywhere(id);document.getElementById('confirmMsg').textContent=e?`刪除「${e.name}」？`:'確定刪除？';document.getElementById('confirmModal').style.display='flex';}
function findExpenseAnywhere(id){for(let i=-12;i<=12;i++){const d=new Date(currentMonth.getFullYear(),currentMonth.getMonth()+i,1);const found=getExpenses(d).find(x=>x.id===id);if(found)return found;}return null;}
function confirmDelete(){
  if(pendingDeleteId&&String(pendingDeleteId).startsWith('pay_')){const pid=parseInt(String(pendingDeleteId).replace('pay_',''));savePayments(getPayments().filter(p=>p.id!==pid));}
  else if(pendingDeleteId){for(let i=-12;i<=12;i++){const d=new Date(currentMonth.getFullYear(),currentMonth.getMonth()+i,1);const ex=getExpenses(d);if(ex.find(x=>x.id===pendingDeleteId)){saveExpenses(ex.filter(x=>x.id!==pendingDeleteId),d);break;}}}
  pendingDeleteId=null;document.getElementById('confirmModal').style.display='none';render();
}
function cancelDelete(){pendingDeleteId=null;document.getElementById('confirmModal').style.display='none';}

function togglePaid(id){
  for(let i=-12;i<=12;i++){const d=new Date(currentMonth.getFullYear(),currentMonth.getMonth()+i,1);const ex=getExpenses(d);const e=ex.find(x=>x.id===id);if(e){e.paid=!e.paid;saveExpenses(ex,d);break;}}
  render();
}

function openEdit(id){
  let e=findExpenseAnywhere(id);if(!e)return;
  editingId=id;
  document.getElementById('e-name').value=e.name;
  document.getElementById('e-amount').value=e.amount;
  document.getElementById('e-date').value=toInput(e.date);
  document.getElementById('e-note').value=e.note||'';
  document.getElementById('e-fixed').checked=!!e.fixed;
  document.getElementById('e-inst').checked=!!e.installment;
  document.getElementById('e-inst-cur').value=e.instCur||'';
  document.getElementById('e-inst-total').value=e.instTotal||'';
  document.getElementById('e-inst-fields').style.display=e.installment?'grid':'none';
  document.getElementById('e-card').innerHTML=getCards().map(c=>`<option ${c===e.card?'selected':''}>${c}</option>`).join('');
  document.getElementById('e-person').innerHTML=getPeople().map(p=>`<option ${p===e.person?'selected':''}>${p}</option>`).join('');
  document.getElementById('editModal').style.display='flex';
}
function closeModal(){document.getElementById('editModal').style.display='none';editingId=null;}
function closeModalOutside(ev){if(ev.target===document.getElementById('editModal'))closeModal();}
function toggleEditInst(){document.getElementById('e-inst-fields').style.display=document.getElementById('e-inst').checked?'grid':'none';}
function saveEdit(){
  if(!editingId)return;
  const nameVal=document.getElementById('e-name').value.trim();const amtVal=parseInt(document.getElementById('e-amount').value);const cardVal=document.getElementById('e-card').value;const personVal=document.getElementById('e-person').value;const dateVal=toSlash(document.getElementById('e-date').value);const noteVal=document.getElementById('e-note').value.trim();const fixedVal=document.getElementById('e-fixed').checked;const isInst=document.getElementById('e-inst').checked;const instCurVal=isInst?parseInt(document.getElementById('e-inst-cur').value||1):null;const instTotalVal=isInst?parseInt(document.getElementById('e-inst-total').value||1):null;
  if(!nameVal||!amtVal||!cardVal||!personVal||!dateVal){alert('請填寫所有必填欄位');return;}

function renderOwed() {
  const seen = new Set();
  const unpaid = [];

  // 本月：非我自己、未收、現金
  getExpenses()
    .filter(e => e.person !== '我自己' && !e.paid && e.card === '現金')
    .forEach(e => {
      if (!seen.has(e.id)) {
        seen.add(e.id);
        unpaid.push(e);
      }
    });

  // 信用卡區間內：非我自己、未收
  getCards().filter(c => c !== '現金').forEach(card => {
    const range = billingRanges[card];
    if (!range || !range.from || !range.to) return;
    getExpensesInRange(range.from, range.to)
      .filter(e => e.card === card && e.person !== '我自己' && !e.paid)
      .forEach(e => {
        if (!seen.has(e.id)) {
          seen.add(e.id);
          unpaid.push(e);
        }
      });
  });

  if (!unpaid.length) {
    return '<div class="empty">目前沒有待收的帳 🎉</div>';
  }

  // 依人分組
  const byP = {};
  getPeople().filter(p => p !== '我自己').forEach(p => { byP[p] = []; });
  unpaid.forEach(e => {
    if (!byP[e.person]) byP[e.person] = [];
    byP[e.person].push(e);
  });

  // 每個人：一張總額卡 + 該人的明細列表
  const personBlocks = Object.entries(byP)
    .filter(([, list]) => list.length > 0)
    .map(([p, list]) => {
      const total = list.reduce((s, e) => s + e.amount, 0);

     const summaryCard = `
  <div class="owed-card">
    <div class="owed-card-header">
      ${personPill(p)}
    </div>
    <div class="owed-card-bottom">
      <div class="owed-total-amt">${fmt(total)}</div>
      <div class="owed-count-wrap">
        <span class="owed-count-num">${list.length}</span>
        <span class="owed-count-label">筆</span>
      </div>
    </div>
  </div>
`;

      const detailCards = list.map(e => {
        const hClass = personHeaderClass(e.person);
        return `
          <div class="expense-card">
            <div class="card-header ${hClass}">
              <span class="card-header-person">${e.person}</span>
              <span class="card-header-date">${e.date}</span>
              <div class="card-header-actions"></div>
            </div>
            <div class="card-body">
              <div class="card-row1">
                <div class="card-name">${e.name}</div>
                <div class="card-amt">${fmt(e.amount)}</div>
              </div>
              <div class="card-row2">
                <div class="card-tags">
                  ${cardPill(e.card)}
                  ${badgeStr(e)}
                </div>
                <button class="btn-sm" onclick="togglePaid(${e.id})">標記已收</button>
              </div>
            </div>
          </div>
        `;
      }).join('');

      return `
        <div style="margin-bottom:20px;">
          ${summaryCard}
          <div class="expense-list">
            ${detailCards}
          </div>
        </div>
      `;
    }).join('');

  return `<div>${personBlocks}</div>`;
}

function applyBillingRange(card){
  const f=document.getElementById(`br-from-${card}`);const t=document.getElementById(`br-to-${card}`);if(!f||!t)return;
  billingRanges[card]={from:toSlash(f.value),to:toSlash(t.value)};S.set('billing_ranges',billingRanges);updateSummary();
  document.getElementById('mainContent').innerHTML=renderBilling();
}

function renderBilling(){
  const settings=getCardSettings();
  const cols=getCards().filter(c=>c!=='現金').map(card=>{
    const s=settings[card]||{};const range=billingRanges[card];
    const fi=range?toInput(range.from):'';const ti=range?toInput(range.to):'';
    const allItems=(range&&range.from&&range.to)?getExpensesInRange(range.from,range.to).filter(e=>e.card===card):[];
    const checks=getBillingChecks(card);
    const total=allItems.reduce((s,e)=>s+e.amount,0);
    const checkedTotal=allItems.filter(e=>checks[e.id]).reduce((s,e)=>s+e.amount,0);
    const uncheckedTotal=total-checkedTotal;
    const checkedCount=allItems.filter(e=>checks[e.id]).length;
    const limit=s.limit||0;const future=getFutureCommitted(card);const realRemaining=limit-future;const pct=limit>0?Math.min(100,Math.round(future/limit*100)):0;
    const bc=pct>=90?'danger':pct>=70?'warn':'safe';const tc=pct>=90?'danger':pct>=70?'warn':'';
    const bar=limit>0?`<div class="limit-bar-bg"><div class="limit-bar-fill ${bc}" style="width:${pct}%"></div></div><div class="limit-meta"><span>已用 ${pct}%（含未付款）</span><span>額度 ${fmt(limit)}</span></div>`:'';
    const remainBlock=limit>0?`<div class="billing-remaining">實際可用 ${fmt(realRemaining)}</div>${future>0?`<div style="font-size:12px;color:#c87030;text-align:right;margin-top:1px;font-weight:700;">未付款佔用 -${fmt(future)}</div>`:''}`:'';
    const itemRows=allItems.length
      ?`<div class="billing-stat-row"><span>${allItems.length} 筆 · 已對帳 ${checkedCount} 筆 <span class="billing-checked-total">✓ ${fmt(checkedTotal)}</span></span><span>未對帳 <strong style="color:var(--blossom);">${fmt(uncheckedTotal)}</strong></span></div>`
       +allItems.map(e=>{
          const isChecked=!!checks[e.id];
          return`<div class="billing-item ${isChecked?'checked':''}">
            <button class="check-btn" onclick="toggleBillingCheck('${card}',${e.id})">✓</button>
            <div class="bi-left">
              <div class="bi-row1">
                <span class="bi-name">${e.name}</span>
                <span class="bi-amt">${fmt(e.amount)}</span>
              </div>
              <div class="bi-row2">
                <div class="bi-tags">${personPill(e.person)}${badgeStr(e)}</div>
                <span class="bi-date">${e.date}</span>
              </div>
            </div>
          </div>`;
        }).join('')
      :`<div class="billing-no-items">${(fi&&ti)?'這段期間沒有消費':'請設定日期範圍後按套用'}</div>`;

    return`<div class="billing-card">
      <div class="billing-card-header">
        <div>${cardPill(card)}<div class="billing-card-info">結帳日：每月 ${s.billingDay||'—'} 號</div></div>
        <div><div class="billing-total ${tc}">${fmt(total)}</div>${remainBlock}</div>
      </div>
      ${bar}
      <div class="billing-date-block">
        <div class="billing-date-grid">
          <div><label>從</label><input type="date" id="br-from-${card}" value="${fi}" style="background:#fff;color-scheme:light;"/></div>
          <div><label>到</label><input type="date" id="br-to-${card}" value="${ti}" style="background:#fff;color-scheme:light;"/></div>
        </div>
        <button class="btn-apply-full" onclick="applyBillingRange('${card}')">套用日期範圍</button>
      </div>
      <div class="billing-items">${itemRows}</div>
    </div>`;
  }).join('');

  return`<div>
    <div style="display:flex;justify-content:flex-end;margin-bottom:14px;">
      <button class="btn btn-primary" style="font-size:14px;padding:10px 18px;" onclick="openPaymentModal()">+ 記錄繳款</button>
    </div>
    <div class="billing-list">${cols}</div>
    <div style="margin-top:22px;"><div class="section-header">繳款紀錄</div>${renderPaymentHistory()}</div>
  </div>`;
}

      async del(key){try{await db.collection(USER).doc(key).delete();return true;}catch(e){console.warn('FB.del',e);return false;}}
    };
    syncFromFirebase();
  }catch(e){console.warn('Firebase init failed:',e);showSyncStatus('離線模式',false,true);}
});
</script>
